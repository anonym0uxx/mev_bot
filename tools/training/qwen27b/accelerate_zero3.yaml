compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_config_file: /mnt/d/repos/mev_bot/tools/training/qwen27b/ds_zero3_nvme.json
  zero3_init_flag: true
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
# bf16 comes from ds_zero3_nvme.json ("bf16": enabled). Do NOT set
# mixed_precision here at all: with deepspeed_config_file, accelerate adds any
# present key to ACCELERATE_CONFIG_DS_FIELDS and hard-errors even on 'no'.
num_machines: 1
num_processes: 3
rdzv_backend: static
same_network: true
use_cpu: false
