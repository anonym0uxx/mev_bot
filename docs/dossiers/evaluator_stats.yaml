component: evaluator_stats
constitution_refs: ["§47", "§48", "§49", "§54", "criteria 74, 107, 108"]
spec: >
  The frozen evaluator's statistics core: reconciled net-SOL aggregation (every cost
  included), per-archetype MFE/MAE distributions and capture-efficiency on
  authenticity-screened flow (criterion 107), per-lane top-k winner-excision PnL
  concentration (criterion 108), versioned inactivity-interval terminal-state labeling
  (criterion 108), post-rejection forward-sampling ledgers per gate (criterion 108), and
  fixed-horizon markouts per fill class. All money in integer lamports (i128 accumulators);
  all ratios bps. Deterministic: same trade set, same numbers, byte-for-byte. This component
  is graded by golden vectors — synthetic trade sets with hand-computed expected outputs —
  because the evaluator that grades everything else must itself be beyond suspicion.
invariants:
  - "net SOL per trade = proceeds - cost_basis - fees - tips - failed_attempt_costs, all lamports, i128-accumulated"
  - "identical input slices produce identical outputs (no HashMap-order effects, no floats in results)"
  - "every statistic carries its sample size; statistics on empty inputs return Missing, never zero-pretending-to-be-data"
  - "MFE/MAE and capture ratios computed only over rows flagged authenticity-screened; unscreened rows are counted and excluded"
  - "top-k excision uses reconciled net SOL, sorted descending, deterministic tie-break by trade id"
adversarial_checks:
  - "a lane whose entire profit sits in 3 trades flips negative under k=3 excision — the statistic must show it (Kamat-class fragility)"
  - "a wash-printed phantom excursion (unscreened) cannot inflate MFE — exclusion test"
  - "an inactivity-labeled token that resumes trading after δT stays labeled for that (T, δT) parameterization — labels are parameter-versioned, not retroactively flipped"
benchmark:
  bench_name: evaluator_stats_bench
  budgets_ns:
    p50_ns: 5000.0
    p99_ns: 50000.0

leaves:
  - leaf_id: ev_net_sol
    responsibility: "reconciled net-SOL aggregation per lane with every cost class included"
    signature: >
      pub fn net_sol(trades: &[ReconTrade], lane: Lane) -> NetSol
      // { net_lamports: i128, gross_lamports: i128, fees: u128, tips: u128, failed_costs: u128, n: u32 }
    invariants:
      - "net = gross - fees - tips - failed_attempt_costs, exactly, i128"
      - "filters to the requested lane; cross-lane blending is impossible by construction (§48 objective law)"
      - "n == number of included trades; empty input -> NetSol::missing()"
    reference_pattern: |
      // fold with i128 accumulators; gross = proceeds as i128 - cost_basis as i128;
      // never f64, never saturating (i128 headroom is the overflow strategy, asserted in debug)
    property_test: |
      #[test]
      fn prop_net_sol_golden() {
          let t = |lane, gross: i128, fee: u128, tip: u128, failc: u128| {
              ReconTrade::test(lane, gross, fee, tip, failc)
          };
          let trades = vec![
              t(Lane::Scalp, 1_000, 100, 50, 10),
              t(Lane::Scalp, -400, 100, 50, 0),
              t(Lane::Early, 9_999, 1, 1, 1), // excluded: other lane
          ];
          let s = net_sol(&trades, Lane::Scalp);
          assert_eq!(s.n, 2);
          assert_eq!(s.gross_lamports, 600);
          assert_eq!(s.net_lamports, 600 - 200 - 100 - 10);
          assert!(net_sol(&[], Lane::Scalp).is_missing());
      }
    max_lines: 35
    temperature_band: low

  - leaf_id: ev_mfe_capture
    responsibility: "per-archetype MFE/MAE distribution and capture-efficiency ratio on screened rows only (criterion 107)"
    signature: >
      pub fn mfe_capture(rows: &[ExcursionRow], key: ArchetypeKey) -> MfeReport
      // { n: u32, excluded_unscreened: u32, mfe_bps: Quartiles, mae_bps: Quartiles, capture_bps_of_mfe: u32 | Missing }
    invariants:
      - "rows without authenticity_screened == true are excluded and counted in excluded_unscreened"
      - "capture = sum(realized_bps clamped >= 0) * 10_000 / sum(mfe_bps), integer division, Missing when sum(mfe)==0"
      - "quartiles via deterministic select on sorted copies (fixed tie-break); no interpolation floats"
    reference_pattern: |
      // filter(screened && row.key == key); sort_unstable for quartiles;
      // capture numerator clamps negative realized to 0 (giveback shows in MAE, not capture)
    property_test: |
      #[test]
      fn prop_capture_ratio_golden_and_screening() {
          let r = |mfe, mae, real, scr| ExcursionRow::test(ArchetypeKey::test(), mfe, mae, real, scr);
          let rows = vec![
              r(400, 100, 200, true),
              r(600, 300, 100, true),
              r(10_000, 0, 10_000, false),
          ];
          let rep = mfe_capture(&rows, ArchetypeKey::test());
          assert_eq!(rep.n, 2);
          assert_eq!(rep.excluded_unscreened, 1); // phantom excursion excluded
          assert_eq!(rep.capture_bps_of_mfe, (300u32 * 10_000) / 1_000); // 3000 bps = 30%
      }
    max_lines: 45
    temperature_band: low

  - leaf_id: ev_topk_excision
    responsibility: "top-k winner-excision PnL concentration per lane (criterion 108)"
    signature: >
      pub fn topk_excision(net_per_trade: &[(TradeId, i128)], ks: &[u32]) -> Vec<Excision>
      // Excision { k: u32, net_without_topk: i128, flipped_negative: bool }
    invariants:
      - "sort descending by net, tie-break ascending TradeId (deterministic)"
      - "for each k: net_without_topk = total - sum(top k nets); flipped_negative = total > 0 && net_without_topk <= 0"
      - "k >= n yields net_without_topk = sum of non-positive trades (all winners removed)"
    reference_pattern: |
      // sort a copied Vec once; prefix-sum the top; answer every k from the prefix sums.
    property_test: |
      #[test]
      fn prop_excision_fragility_detected() {
          let t = |id, v: i128| (TradeId::test(id), v);
          // Kamat-shaped book: +117 total, top-3 carry it
          let book = vec![t(1, 60), t(2, 40), t(3, 30), t(4, -5), t(5, -8)];
          let ex = topk_excision(&book, &[1, 3]);
          assert_eq!(ex[0].net_without_topk, 57);
          assert!(!ex[0].flipped_negative);
          assert_eq!(ex[1].net_without_topk, -13);
          assert!(ex[1].flipped_negative); // the lottery ticket exposed
      }
    max_lines: 35
    temperature_band: low

  - leaf_id: ev_inactivity_label
    responsibility: "versioned inactivity-interval terminal-state labeler (criterion 108)"
    signature: >
      pub fn label_terminal(swap_ts_ns: &[u64], window_end_ns: u64, delta_t_ns: u64)
      -> TerminalLabel  // { dead: bool, died_at_ns: Option<u64>, params_version: (u64, u64) }
    invariants:
      - "dead iff there exists a gap >= delta_t_ns between consecutive swaps (or last swap and window_end)"
      - "died_at_ns = end of the last swap before the first qualifying gap"
      - "params_version records (delta_t_ns, window_end_ns) — labels are parameterized facts, never global truths"
      - "input timestamps must be non-decreasing; violation is an input error, not a sort"
    reference_pattern: |
      // scan adjacent pairs plus the (last, window_end) pair; first gap >= delta_t wins;
      // empty swap list with window >= delta_t => dead at window start semantics documented.
    property_test: |
      #[test]
      fn prop_inactivity_label_golden() {
          // swaps at 0, 10, 300; window ends 1000; delta_t = 200
          // gaps: 0->10 (10), 10->300 (290 >= 200: FIRST qualifying gap), 300->1000 (700)
          let l = label_terminal(&[0, 10, 300], 1_000, 200);
          assert!(l.dead);
          assert_eq!(l.died_at_ns, Some(10)); // first qualifying gap starts after the swap at 10
          assert_eq!(l.params_version, (200, 1_000));
          let alive = label_terminal(&[0, 100, 200, 300, 900], 1_000, 700);
          assert!(!alive.dead);
          let tail_dead = label_terminal(&[0, 50], 1_000, 500);
          assert_eq!(tail_dead.died_at_ns, Some(50)); // trailing (last, window_end) gap qualifies
      }
    max_lines: 35
    temperature_band: low

  - leaf_id: ev_prfs_ledger
    responsibility: "post-rejection forward-sampling ledger: per-gate loss-avoided / upside-foregone (criterion 108)"
    signature: >
      pub fn prfs_fold(samples: &[PrfsSample]) -> Vec<GateLedger>
      // PrfsSample { gate: GateId, ref_price_fp: u64, sampled_price_fp: u64, horizon_s: u32 }
      // GateLedger { gate: GateId, n: u32, halved_within_24h: u32, doubled_within_24h: u32,
      //              loss_avoided_bps_sum: i128, upside_foregone_bps_sum: i128 }
    invariants:
      - "halved: sampled <= ref/2 within 24h horizon; doubled: sampled >= ref*2 within 24h (both counted per rejection event, not per sample)"
      - "loss_avoided accumulates negative moves as positive avoided bps; upside_foregone accumulates positive moves — a gate is judged on BOTH (over-rejection law)"
      - "grouped by gate with deterministic (sorted GateId) output order"
    reference_pattern: |
      // UNVERIFIED FRONTIER REFERENCE (Fable). Not compiled here. property_test is authority.
      //
      // pub struct PrfsSample { pub gate: GateId, pub event: RejectionEventId,
      //     pub ref_price_fp: u64, pub sampled_price_fp: u64, pub horizon_s: u32, pub age_s: u32 }
      // pub struct GateLedger { pub gate: GateId, pub n: u32,
      //     pub halved_within_24h: u32, pub doubled_within_24h: u32,
      //     pub loss_avoided_bps_sum: i128, pub upside_foregone_bps_sum: i128 }
      //
      // pub fn prfs_fold(samples: &[PrfsSample]) -> Vec<GateLedger> {
      //     use std::collections::BTreeMap;
      //     // 1) reduce to per-(gate,event) worst and best excursion within 24h.
      //     struct Ev { ref_fp: u64, worst_fp: u64, best_fp: u64 }
      //     let mut ev: BTreeMap<(GateId, RejectionEventId), Ev> = BTreeMap::new();
      //     for s in samples {
      //         if s.age_s > 86_400 { continue; }               // 24h horizon
      //         let e = ev.entry((s.gate, s.event)).or_insert(Ev {
      //             ref_fp: s.ref_price_fp, worst_fp: s.sampled_price_fp, best_fp: s.sampled_price_fp });
      //         e.worst_fp = e.worst_fp.min(s.sampled_price_fp);
      //         e.best_fp  = e.best_fp.max(s.sampled_price_fp);
      //     }
      //     // 2) fold events into per-gate ledgers (BTreeMap keeps gate order deterministic).
      //     let mut out: BTreeMap<GateId, GateLedger> = BTreeMap::new();
      //     for ((gate, _), e) in ev {
      //         let g = out.entry(gate).or_insert(GateLedger { gate, n: 0,
      //             halved_within_24h: 0, doubled_within_24h: 0,
      //             loss_avoided_bps_sum: 0, upside_foregone_bps_sum: 0 });
      //         g.n += 1;
      //         if e.worst_fp <= e.ref_fp / 2 { g.halved_within_24h += 1; }
      //         if e.best_fp  >= e.ref_fp.saturating_mul(2) { g.doubled_within_24h += 1; }
      //         // loss avoided: how far below ref the worst went (a gate that rejected ate this loss)
      //         let down_bps = bps_move(e.ref_fp, e.worst_fp.min(e.ref_fp)); // <= 0 move -> positive avoided
      //         g.loss_avoided_bps_sum += (-down_bps) as i128;
      //         // upside foregone: how far above ref the best went (the gate also ate this winner)
      //         let up_bps = bps_move(e.ref_fp, e.best_fp.max(e.ref_fp));
      //         g.upside_foregone_bps_sum += up_bps as i128;
      //     }
      //     out.into_values().collect()
      // }
      //
      // fn bps_move(from: u64, to: u64) -> i64 { // signed bps of (to-from)/from
      //     let num = to as i128 - from as i128;
      //     ((num * 10_000) / from.max(1) as i128) as i64
      // }
      //
      // The over-rejection law is why BOTH sides accumulate: a gate is judged on losses it avoided
      // AND winners it discarded. Per-EVENT worst/best (not per-sample) prevents one noisy event
      // from double-counting.
    property_test: |
      #[test]
      fn prop_prfs_both_sides_of_the_ledger() {
          let s = |g, r, p| PrfsSample::test(g, r, p, 3600);
          let samples = vec![
              s(1, 1_000, 400),   // halved: filter ate a loss
              s(1, 1_000, 2_500), // doubled: filter ate a winner
              s(2, 1_000, 990),
          ];
          let ledgers = prfs_fold(&samples);
          let g1 = &ledgers[0];
          assert_eq!(g1.halved_within_24h, 1);
          assert_eq!(g1.doubled_within_24h, 1); // over-rejection is visible, not hidden
          assert!(g1.loss_avoided_bps_sum > 0 && g1.upside_foregone_bps_sum > 0);
      }
    max_lines: 55
    temperature_band: high

  - leaf_id: ev_markout
    responsibility: "fixed-horizon markouts per fill class vs decision and fill reference prices"
    signature: >
      pub fn markouts(fills: &[FillRow], horizons_s: &[u32]) -> Vec<MarkoutCell>
      // MarkoutCell { class: FillClass, horizon_s: u32, n: u32, median_bps: i32, mean_bps_x100: i64 }
    invariants:
      - "markout = signed bps move from fill price to horizon price, sign-adjusted so positive == favorable to the position"
      - "median via deterministic select; mean in fixed-point x100 (no floats in output)"
      - "cells with n == 0 are omitted, never emitted as zeros"
    reference_pattern: |
      // for each (class, horizon): collect sign-adjusted bps, select median, integer mean x100;
      // sign adjust: buys favor up (+), sells favor down (+) — one helper, tested.
    property_test: |
      #[test]
      fn prop_markout_sign_adjustment() {
          let f =
              |side, fill: u64, later: u64| FillRow::test(FillClass::ScalpEntry, side, fill, later, 30);
          let rows = vec![f(Side::Buy, 1_000, 1_100), f(Side::Sell, 1_000, 900)];
          let m = markouts(&rows, &[30]);
          assert_eq!(m[0].n, 2);
          assert_eq!(m[0].median_bps, 1_000); // both favorable: +10% == +1000 bps
      }
    max_lines: 45
    temperature_band: low
