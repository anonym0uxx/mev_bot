spec: Independence-lock dossier for the `manifest` module of pump-quant-journal. Each leaf's property_test is the locked correctness authority over that leaf's public contract, verified to compile and pass against the committed Phase-A implementation. Decision logic is integer/deterministic (§22).
invariants: []
adversarial_checks: []
leaves:
- leaf_id: mf_add_ordering
  responsibility: Manifest::add enforces valid-range, strictly-increasing segment_id, and exact sequence contiguity, leaving the index unchanged on any rejection.
  signature: 'pub fn add(&mut self, entry: SealedSegment) -> Result<(), ManifestError>'
  invariants:
  - A contiguous run whose segment_ids strictly increase and whose first_sequence equals prev.last_sequence+1 is accepted in order, growing len() by one each time.
  - An entry whose first_sequence != prev.last_sequence+1 is rejected with NonContiguous { expected = prev.last_sequence+1, found } and len() is unchanged.
  - An entry whose segment_id <= prev.segment_id is rejected with SegmentOutOfOrder { previous, found } and len() is unchanged.
  - An entry with first_sequence > last_sequence is rejected with InvalidRange { first, last }; after any rejection a subsequent valid entry is still accepted.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    fn entry(id: u64, first: u64, last: u64, frames: u32, bytes: u64, hash: u64) -> SealedSegment {
        SealedSegment {
            segment_id: id,
            schema_version: 1,
            connection_epoch: 0,
            first_sequence: first,
            last_sequence: last,
            frame_count: frames,
            byte_len: bytes,
            content_hash: hash,
        }
    }

    #[test]
    fn mf_add_ordering_property() {
        // Contiguous, strictly-increasing-id run is accepted in order.
        let mut m = Manifest::new();
        assert!(m.is_empty());
        m.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        m.add(entry(1, 10, 19, 10, 200, 0xBB)).unwrap();
        m.add(entry(2, 20, 24, 5, 50, 0xCC)).unwrap();
        assert_eq!(m.len(), 3);
        assert!(!m.is_empty());
        assert_eq!(m.get(1).map(|e| e.segment_id), Some(1));

        // NonContiguous: next must start at 25; start at 21. Rejected, unchanged.
        match m.add(entry(3, 21, 30, 10, 100, 1)) {
            Err(ManifestError::NonContiguous { expected, found }) => {
                assert_eq!(expected, 25);
                assert_eq!(found, 21);
            }
            other => panic!("expected NonContiguous, got {other:?}"),
        }
        assert_eq!(m.len(), 3);

        // SegmentOutOfOrder: contiguous seq but non-increasing id. Rejected, unchanged.
        match m.add(entry(2, 25, 30, 6, 60, 2)) {
            Err(ManifestError::SegmentOutOfOrder { previous, found }) => {
                assert_eq!(previous, 2);
                assert_eq!(found, 2);
            }
            other => panic!("expected SegmentOutOfOrder, got {other:?}"),
        }
        assert_eq!(m.len(), 3);

        // A valid continuation is still accepted after rejections (state intact).
        m.add(entry(3, 25, 30, 6, 60, 3)).unwrap();
        assert_eq!(m.len(), 4);

        // InvalidRange: first > last on the very first entry.
        let mut e = Manifest::new();
        match e.add(entry(0, 10, 5, 1, 10, 1)) {
            Err(ManifestError::InvalidRange { first, last }) => {
                assert_eq!(first, 10);
                assert_eq!(last, 5);
            }
            other => panic!("expected InvalidRange, got {other:?}"),
        }
        assert_eq!(e.len(), 0);
    }
- leaf_id: mf_find_by_sequence
  responsibility: Manifest::find_by_sequence binary-searches the contiguous ordered ranges, returning the index of the segment covering a sequence or None when uncovered.
  signature: 'pub fn find_by_sequence(&self, sequence: u64) -> Option<usize>'
  invariants:
  - For any sequence s in [first,last] of some entry, find_by_sequence(s) = Some(idx) where entries[idx].first_sequence <= s <= entries[idx].last_sequence.
  - Boundary sequences (each entry's first and last) resolve to that entry's index.
  - A sequence beyond the manifest's total span (e.g. one past the last, or u64::MAX) returns None.
  - On an empty manifest find_by_sequence returns None and sequence_span returns None.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    fn entry(id: u64, first: u64, last: u64, frames: u32, bytes: u64, hash: u64) -> SealedSegment {
        SealedSegment {
            segment_id: id,
            schema_version: 1,
            connection_epoch: 0,
            first_sequence: first,
            last_sequence: last,
            frame_count: frames,
            byte_len: bytes,
            content_hash: hash,
        }
    }

    #[test]
    fn mf_find_by_sequence_property() {
        let mut m = Manifest::new();
        m.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        m.add(entry(1, 10, 19, 10, 200, 0xBB)).unwrap();
        m.add(entry(2, 20, 24, 5, 50, 0xCC)).unwrap();

        // Every in-range sequence resolves to the segment whose [first,last] contains it.
        assert_eq!(m.find_by_sequence(0), Some(0));
        assert_eq!(m.find_by_sequence(9), Some(0));
        assert_eq!(m.find_by_sequence(10), Some(1));
        assert_eq!(m.find_by_sequence(15), Some(1));
        assert_eq!(m.find_by_sequence(19), Some(1));
        assert_eq!(m.find_by_sequence(20), Some(2));
        assert_eq!(m.find_by_sequence(24), Some(2));

        // Consistency: for every covered sequence, the found entry's range contains it.
        for s in 0u64..=24 {
            let idx = m.find_by_sequence(s).expect("covered");
            let e = m.get(idx).unwrap();
            assert!(e.first_sequence <= s && s <= e.last_sequence);
        }

        // Out-of-range past the end resolves to None.
        assert_eq!(m.find_by_sequence(25), None);
        assert_eq!(m.find_by_sequence(u64::MAX), None);

        // Empty manifest: nothing is found, span/totals reflect emptiness.
        let empty = Manifest::new();
        assert_eq!(empty.find_by_sequence(0), None);
        assert_eq!(empty.sequence_span(), None);
        assert_eq!(m.sequence_span(), Some((0, 24)));
    }
- leaf_id: mf_totals
  responsibility: Manifest::total_frames/total_bytes/sequence_span aggregate indexed entries with checked arithmetic, yielding None on u64 overflow.
  signature: pub fn total_frames(&self) -> Option<u64>; pub fn total_bytes(&self) -> Option<u64>; pub fn sequence_span(&self) -> Option<(u64, u64)>
  invariants:
  - On an empty manifest total_frames and total_bytes are Some(0) and sequence_span is None.
  - total_frames equals the exact sum of every entry.frame_count and total_bytes equals the exact sum of every entry.byte_len.
  - sequence_span equals (first entry.first_sequence, last entry.last_sequence).
  - A byte_len sum exceeding u64::MAX makes total_bytes return None while total_frames and sequence_span remain unaffected.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    fn entry(id: u64, first: u64, last: u64, frames: u32, bytes: u64, hash: u64) -> SealedSegment {
        SealedSegment {
            segment_id: id,
            schema_version: 1,
            connection_epoch: 0,
            first_sequence: first,
            last_sequence: last,
            frame_count: frames,
            byte_len: bytes,
            content_hash: hash,
        }
    }

    #[test]
    fn mf_totals_property() {
        // Empty: identities are the additive units, span undefined.
        let empty = Manifest::new();
        assert_eq!(empty.total_frames(), Some(0));
        assert_eq!(empty.total_bytes(), Some(0));
        assert_eq!(empty.sequence_span(), None);

        // Sums equal the independent hand-computed totals.
        let mut m = Manifest::new();
        m.add(entry(0, 0, 9, 10, 100, 1)).unwrap();
        m.add(entry(1, 10, 19, 10, 200, 2)).unwrap();
        m.add(entry(2, 20, 24, 5, 50, 3)).unwrap();
        assert_eq!(m.total_frames(), Some(25));
        assert_eq!(m.total_bytes(), Some(350));
        assert_eq!(m.sequence_span(), Some((0, 24)));

        // total_bytes overflow -> None (checked add). First entry carries u64::MAX bytes,
        // second adds more, contiguity preserved.
        let mut ov = Manifest::new();
        ov.add(entry(0, 0, 9, 10, u64::MAX, 1)).unwrap();
        ov.add(entry(1, 10, 19, 10, 5, 2)).unwrap();
        assert_eq!(ov.total_bytes(), None);
        // Frame totals are unaffected and still exact.
        assert_eq!(ov.total_frames(), Some(20));
        assert_eq!(ov.sequence_span(), Some((0, 19)));
    }
- leaf_id: mf_content_hash
  responsibility: Manifest::content_hash folds entry count and every entry field into one deterministic FNV-1a-64 value that changes iff any indexed field or the entry count changes.
  signature: pub fn content_hash(&self) -> u64
  invariants:
  - 'Determinism: two manifests built from identical entry sequences produce equal content_hash values.'
  - The empty manifest's hash is distinct from any non-empty manifest's hash (count is domain-separated).
  - Mutating exactly one field of one entry (e.g. content_hash or byte_len) changes the resulting hash.
  - A proper prefix of the entries (fewer entries) hashes differently from the full manifest.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    fn entry(id: u64, first: u64, last: u64, frames: u32, bytes: u64, hash: u64) -> SealedSegment {
        SealedSegment {
            segment_id: id,
            schema_version: 1,
            connection_epoch: 0,
            first_sequence: first,
            last_sequence: last,
            frame_count: frames,
            byte_len: bytes,
            content_hash: hash,
        }
    }

    fn build() -> Manifest {
        let mut m = Manifest::new();
        m.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        m.add(entry(1, 10, 19, 10, 200, 0xBB)).unwrap();
        m.add(entry(2, 20, 24, 5, 50, 0xCC)).unwrap();
        m
    }

    #[test]
    fn mf_content_hash_property() {
        // Determinism: identical entry sequences fold to the identical hash.
        let base = build().content_hash();
        assert_eq!(build().content_hash(), base);

        // Empty manifest has a distinct, well-defined hash (domain-separated by count).
        let empty = Manifest::new().content_hash();
        assert_ne!(empty, base);

        // Field sensitivity: mutating exactly one field (content_hash of last entry)
        // changes the fold.
        let mut mh = Manifest::new();
        mh.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        mh.add(entry(1, 10, 19, 10, 200, 0xBB)).unwrap();
        mh.add(entry(2, 20, 24, 5, 50, 0xCD)).unwrap();
        assert_ne!(mh.content_hash(), base);

        // byte_len sensitivity on the middle entry also moves the hash.
        let mut mb = Manifest::new();
        mb.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        mb.add(entry(1, 10, 19, 10, 201, 0xBB)).unwrap();
        mb.add(entry(2, 20, 24, 5, 50, 0xCC)).unwrap();
        assert_ne!(mb.content_hash(), base);

        // Count separation: a two-entry prefix does not collide with the three-entry hash.
        let mut prefix = Manifest::new();
        prefix.add(entry(0, 0, 9, 10, 100, 0xAA)).unwrap();
        prefix.add(entry(1, 10, 19, 10, 200, 0xBB)).unwrap();
        assert_ne!(prefix.content_hash(), base);
    }
