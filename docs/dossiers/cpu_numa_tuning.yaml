component: cpu_numa_tuning
constitution_refs: ["§57", "performance-engineering law (§24)", "criteria 1, 2, 21, 109"]
spec: >
  Windows-native CPU topology discovery, pin-plan derivation, and runtime application for
  the hot thread set. Decision logic is PURE and fully testable (topology in, plan out);
  OS interaction is confined to thin, mockable adapters over the Windows APIs
  (GetLogicalProcessorInformationEx, SetThreadGroupAffinity, priority classes,
  timeBeginPeriod, VirtualLock). NO Linux-isms: mlockall, sched_setaffinity, /proc are
  forbidden in this component (the repository's libc mlockall is the named porting defect
  this dossier retires). Plans place each hot thread on its own physical core, leave SMT
  siblings of hot cores unassigned, keep hot cores off group boundaries where possible, and
  reserve non-hot cores for tokio/control/OS. Every applied setting is verified by reading
  it back and by a measured jitter probe; unverifiable settings are reported, never assumed.
invariants:
  - "plan derivation is a pure function of (Topology, HotThreadSpec) — no OS calls inside it"
  - "no two hot threads share a physical core; no hot thread shares a physical core with any SMT sibling assignment"
  - "OS adapter calls return read-back-verified results (Applied { requested, observed }) — a silent no-op is a defect"
  - "all Windows API usage is behind the OsTune trait so tests run with a mock on any platform"
  - "no libc::mlockall, sched_setaffinity, or /proc access anywhere in the component (lint-tested by source scan)"
adversarial_checks:
  - "a topology with fewer physical cores than hot threads returns PlanError::Insufficient, never a doubled-up plan"
  - "a multi-group (>64 logical CPU) topology never assigns one thread a mask spanning groups"
  - "priority elevation on a starved single-core mock reports the starvation hazard rather than hanging the plan"
benchmark:
  bench_name: cpu_numa_bench
  budgets_ns:
    p50_ns: 100.0

leaves:
  - leaf_id: cn_topology_model
    responsibility: "typed topology model + parser from the raw processor-relationship records"
    signature: >
      pub fn parse_topology(records: &[ProcRecord]) -> Result<Topology, TopoErr>
      // Topology { groups: ArrayVec<Group, MAX_GROUPS>, physical_cores: u16, logical_cpus: u16 }
      // Core { group: u16, physical_id: u16, logical_mask: u64, smt_siblings: u8, numa_node: u8, efficiency_class: u8 }
    invariants:
      - "every logical CPU appears in exactly one core's mask; masks within a group are disjoint"
      - "physical_cores counts distinct physical ids; SMT sibling count derived from mask popcount"
      - "malformed records (overlapping masks, empty mask) -> TopoErr, never a silently wrong model"
    reference_pattern: |
      // fold RelationProcessorCore records: each carries a group id + u64 mask;
      // popcount > 1 => SMT; collect numa/efficiency class from companion records;
      // validate disjointness with a per-group accumulator mask.
    property_test: |
      #[test]
      fn prop_topology_parse_and_validate() {
          // 2 physical cores, SMT2: masks 0b0011 and 0b1100 in group 0
          let recs = vec![ProcRecord::core(0, 0b0011), ProcRecord::core(0, 0b1100)];
          let t = parse_topology(&recs).unwrap();
          assert_eq!(t.physical_cores, 2);
          assert_eq!(t.logical_cpus, 4);
          let overlap = vec![ProcRecord::core(0, 0b0011), ProcRecord::core(0, 0b0110)];
          assert!(parse_topology(&overlap).is_err());
      }
    max_lines: 55
    temperature_band: low

  - leaf_id: cn_pin_plan
    responsibility: "derive the hot-thread pin plan: one physical core per hot thread, SMT siblings idle, control set separated"
    signature: >
      pub fn derive_plan(t: &Topology, hot: &[HotThreadSpec]) -> Result<PinPlan, PlanError>
      // PinPlan { assignments: ArrayVec<(ThreadId, GroupAffinity), MAX_HOT>, control_mask: GroupMask, reserved_idle: GroupMask }
    invariants:
      - "each hot thread gets a single-logical-CPU GroupAffinity on a distinct physical core (one CPU of that core's mask)"
      - "the OTHER logical CPUs of every hot physical core go into reserved_idle (assigned to nothing)"
      - "control_mask = all remaining CPUs; it never intersects hot assignments or reserved_idle"
      - "PlanError::Insufficient when distinct physical cores < hot.len(); prefer higher efficiency_class cores for hot"
    reference_pattern: |
      // UNVERIFIED FRONTIER REFERENCE (Fable). Not compiled here. property_test is authority.
      //
      // pub struct GroupAffinity { pub group: u16, pub mask: u64 } // single-CPU mask for a hot thread
      // pub struct GroupMask { pub group: u16, pub mask: u64 }
      // pub struct PinPlan {
