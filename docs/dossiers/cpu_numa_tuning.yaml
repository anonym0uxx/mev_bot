    max_lines: 60
    temperature_band: high

  - leaf_id: cn_os_apply
    responsibility: "apply a pin plan through the mockable OsTune trait with read-back verification"
    signature: |
      pub trait OsTune {
          fn set_affinity(&mut self, th: ThreadId, aff: GroupAffinity) -> Result<GroupAffinity, OsErr>;
          fn set_priority(&mut self, th: ThreadId, prio: Prio) -> Result<Prio, OsErr>;
          fn set_timer_res_ms(&mut self, ms: u32) -> Result<u32, OsErr>;
          /// # Safety
          /// ptr must be the start of, and len must lie entirely within, a single
          /// committed region owned by this process. That region must remain allocated
          /// until either unlock_region is called for it or this adapter is dropped,
          /// whichever happens first. The obligation is NOT bound to a returned value:
          /// this method returns the ALIGNED byte count, and the adapter owns the unlock.
          unsafe fn lock_region(&mut self, ptr: *const u8, len: usize) -> Result<usize, OsErr>;
      }
      pub fn apply_plan(os: &mut dyn OsTune, plan: &PinPlan, prio: Prio) -> ApplyReport
    #
    # FUTURE REFINEMENT (recorded, not for this commit):
    #   fn lock_region<'a>(&mut self, region: &'a [u8]) -> Result<LockGuard<'a>, OsErr>
    # The borrow checker then enforces the WHOLE invariant: the guard holds a borrow of the
    # region, so it cannot be freed while locked. No unsafe at the call site, no new owning
    # type, and lifetime parameters keep the trait object-safe for dyn OsTune. Strictly
    # better than both options presented; deferred only because it changes the return type
    # and every caller.
    invariants:
      - "every call's returned observed value is compared to requested; mismatches land in ApplyReport::mismatches, never dropped"
      - "partial failure applies nothing further to the failed thread but continues others; report is complete either way"
      - "the Windows implementation of OsTune uses SetThreadGroupAffinity / SetPriorityClass / timeBeginPeriod / VirtualLock and NOTHING from libc"
    reference_pattern: |
      // for (th, aff) in plan { match os.set_affinity(th, aff) {
      //   Ok(obs) if obs == aff => report.applied.push(..),
      //   Ok(obs) => report.mismatches.push(Requested{aff}, Observed{obs}),
      //   Err(e) => report.errors.push((th, e)) } }
    property_test: |
      #[test]
      fn prop_apply_verifies_readback() {
          let recs = vec![ProcRecord::core(0, 0b0011), ProcRecord::core(0, 0b1100)];
          let t = parse_topology(&recs).unwrap();
          let plan = derive_plan(&t, &[HotThreadSpec::test("x")]).unwrap();
          let mut ok = MockOs::faithful();
          let r = apply_plan(&mut ok, &plan, Prio::High);
          assert!(r.mismatches.is_empty() && r.errors.is_empty());
          let mut lying = MockOs::returns_wrong_affinity();
          let r2 = apply_plan(&mut lying, &plan, Prio::High);
          assert_eq!(r2.mismatches.len(), 1); // silent no-op is surfaced, not trusted
      }
    depends_on: ["cn_pin_plan"]
    max_lines: 55
    temperature_band: low

  - leaf_id: cn_jitter_probe
    responsibility: "measured verification: scheduling-jitter probe over a pinned spin loop, pure aggregation"
    signature: >
      pub fn jitter_stats(deltas_ns: &[u64]) -> JitterStats
      // { p50_ns: u64, p99_ns: u64, p999_ns: u64, max_ns: u64, n: u32 }
    invariants:
      - "percentiles by deterministic select on a sorted copy (nearest-rank), documented and tested"
      - "empty input -> JitterStats::missing(); no fabricated zeros"
      - "aggregation is pure — the sampling loop (TSC deltas on the pinned thread) lives in the harness, not here"
    reference_pattern: |
      // sort copy; nearest-rank: idx = ((p * n) + 99) / 100 - 1 clamped; max = last;
      // the bench harness compares p999 against the budget and against the UNPINNED baseline.
    property_test: |
      #[test]
      fn prop_jitter_percentiles_nearest_rank() {
          let deltas: Vec<u64> = (1..=100).collect();
          let s = jitter_stats(&deltas);
          assert_eq!(s.p50_ns, 50);
          assert_eq!(s.p99_ns, 99);
          assert_eq!(s.p999_ns, 100); // nearest-rank on n=100
          assert_eq!(s.max_ns, 100);
          assert!(jitter_stats(&[]).is_missing());
      }
    max_lines: 30
    temperature_band: low

safety:
  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:705 fn apply_plan — unsafe { os.lock_region() }"
    compiler_cannot_verify: "The # Safety contract on lock_region requires the caller to prove the pointer is a live committed region. The compiler cannot check pointer validity or region liveness."
    callee_preconditions: "ptr must be the start of a single committed region owned by this process; len must lie entirely within it; region must remain allocated until unlock or adapter drop"
    safe_code_establishes: "region is a &[u8] slice borrow, live for the scope of apply_plan; the slice originates from a stack-allocated buffer in the test harness, never freed mid-call"
    failure_modes: "lock_region returns Err(OsErr) on VirtualLock failure — the error propagates to ApplyReport.errors, the tuning run aborts (FAIL CLOSED)"
    system_safety: "None — this is a trait call site, not a Win32 API call. The system hazard is in the callee (VirtualLock), not here."
    invalidation: "if region becomes a dangling pointer (e.g. caller frees the slice before the unsafe block), the # Safety contract is violated and this block becomes UB"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:909 impl Drop for TimerResGuard — timeEndPeriod"
    compiler_cannot_verify: "FFI call correctness; that self.period_ms is a period previously begun by timeBeginPeriod"
    callee_preconditions: "timeEndPeriod must receive the same period value that was passed to timeBeginPeriod; the winmm API must be linked"
    safe_code_establishes: "self.active is true only if acquire() succeeded (timeBeginPeriod returned 0); self.period_ms is the clamped value from timeGetDevCaps, so it is in the valid range [wPeriodMin, wPeriodMax]"
    failure_modes: "timeEndPeriod returns non-zero MMRESULT — ignored on drop (no panic in Drop); the timer period may remain elevated until process exit"
    system_safety: "If timeEndPeriod fails, the system timer resolution remains at the elevated frequency, increasing timer-interrupt rate system-wide. This is a transient system effect cleared on process exit, not a memory-safety hazard."
    invalidation: "if self.period_ms is modified after acquire() to a value not matching the timeBeginPeriod call, timeEndPeriod will be called with the wrong period"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:927 fn TimerResGuard::acquire — timeGetDevCaps + timeBeginPeriod"
    compiler_cannot_verify: "FFI call correctness; that MaybeUninit<TimeCaps> is properly aligned and sized; that timeGetDevCaps wrote the struct on success"
    callee_preconditions: "timeGetDevCaps must receive a writable pointer to a TimeCaps struct and its byte size; timeBeginPeriod must receive a period in [wPeriodMin, wPeriodMax]"
    safe_code_establishes: "caps is a stack-allocated MaybeUninit<TimeCaps>, properly aligned by Rust's stack layout; the byte size is computed from size_of::<TimeCaps>; caps.assume_init() is only called after checking rc_c == 0 (success); period is clamped to [wPeriodMin, wPeriodMax] from the caps returned by the device"
    failure_modes: "timeGetDevCaps returns non-zero MMRESULT → Err(OsErr::Mm); timeBeginPeriod returns non-zero → Err(OsErr::Mm). Both FAIL CLOSED — the guard is not created."
    system_safety: "timeBeginPeriod raises the system timer interrupt frequency system-wide, increasing context-switch overhead for ALL processes. This is the intended behavior for low-latency tuning, not a memory-safety hazard. The granted period has NO read-back API — it is UNVERIFIABLE."
    invalidation: "if assume_init() is called before checking rc_c == 0, the TimeCaps fields are uninitialised garbage; if the period is not clamped to device caps, timeBeginPeriod may receive an out-of-range value"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:980 fn WinOsTune::new — GetSystemInfo + assume_init"
    compiler_cannot_verify: "FFI call correctness; that GetSystemInfo wrote the full SystemInfo struct; that the dwPageSize field is a valid page size"
    callee_preconditions: "GetSystemInfo must receive a writable pointer to a SystemInfo struct of the correct layout"
    safe_code_establishes: "sysinfo is a stack-allocated MaybeUninit<SystemInfo>, properly aligned; GetSystemInfo is a void function that always succeeds and writes the full struct; assume_init() is called immediately after GetSystemInfo returns, which is correct because GetSystemInfo always writes"
    failure_modes: "GetSystemInfo cannot fail (void return). If the struct layout is wrong, the page_size would be garbage — but the #[repr(C)] attribute ensures ABI compatibility."
    system_safety: "None — GetSystemInfo is a read-only query with no system side effects."
    invalidation: "if the SystemInfo struct layout diverges from the Win32 ABI (e.g. field order, padding), dwPageSize would read garbage; if assume_init() is called before GetSystemInfo, the struct is uninitialised"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:1008 fn ensure_working_set — SetProcessWorkingSetSize + GetLastError"
    compiler_cannot_verify: "FFI call correctness; that the min/max values are valid for this process's commit limit"
    callee_preconditions: "SetProcessWorkingSetSize must receive a valid process handle and non-zero min/max values; min must be <= max"
    safe_code_establishes: "GetCurrentProcess returns a pseudo-handle, always valid; min_ws = lock_budget (non-zero, set in new()), max_ws = lock_budget + 1MB headroom; values are byte counts, never 0 or SIZE_MAX; the working_set_raised flag prevents re-calling after first success"
    failure_modes: "SetProcessWorkingSetSize returns 0 (FALSE) → Err(OsErr::Win32) with GetLastError code. FAIL CLOSED — lock_region will fail with WorkingSetQuota on the next call."
    system_safety: "Raising the working-set minimum pins a minimum amount of the process's virtual address space as non-pageable. Against a 383.6 GB commit limit on this host, the lock budget (a few MB) is negligible. If the budget were set to a large fraction of commit limit, it could pressure the kernel's memory manager — the explicit byte budget in the dossier is the control."
    invalidation: "if lock_budget is 0, SetProcessWorkingSetSize may reject it; if lock_budget exceeds the commit limit, the call fails and lock_region cannot succeed"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:1028 impl Drop for WinOsTune — VirtualUnlock"
    compiler_cannot_verify: "FFI call correctness; that each (ptr, len) pair was previously VirtualLock'd"
    callee_preconditions: "VirtualUnlock must receive the base pointer and size of a region that was previously locked by VirtualLock"
    safe_code_establishes: "locked_ranges only contains entries that were pushed after a successful VirtualLock (the push happens only after ok != 0); the aligned_start and aligned_len are the exact values passed to VirtualLock"
    failure_modes: "VirtualUnlock returns 0 (FALSE) — ignored on drop (no panic in Drop). The locked pages may remain pinned until process exit."
    system_safety: "If VirtualUnlock fails, the locked pages remain non-pageable, consuming physical memory until process exit. With a small lock budget, this is bounded and transient."
    invalidation: "if locked_ranges is modified to contain entries not from successful VirtualLock calls, VirtualUnlock will be called on regions that were never locked"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:1061 fn set_affinity — SetThreadGroupAffinity + GetThreadGroupAffinity + GetActiveProcessorGroupCount + GetActiveProcessorCount + GetCurrentThread + GetLastError"
    compiler_cannot_verify: "FFI call correctness; that GroupAffinityWin struct layout matches the Win32 GROUP_AFFINITY ABI; that MaybeUninit out-params are only read after success"
    callee_preconditions: "SetThreadGroupAffinity requires a valid thread handle, a pointer to a fully-initialised GROUP_AFFINITY with Reserved=[0;3], and a writable out-param (or NULL); GetThreadGroupAffinity requires a valid thread handle and writable out-param"
    safe_code_establishes: "group bounds checked: aff.group < GetActiveProcessorGroupCount() before any SetThreadGroupAffinity call; mask bounds checked: aff.mask & !legal_mask == 0 where legal_mask is derived from GetActiveProcessorCount(aff.group); GroupAffinityWin.Reserved explicitly set to [0;3] (the read-back trap if non-zero); MaybeUninit out-params (prev, observed) only assume_init()'d after checking return != 0"
    failure_modes: "SetThreadGroupAffinity returns 0 → Err(OsErr::Win32) FAIL CLOSED; GetThreadGroupAffinity returns 0 → Err(OsErr::Win32) FAIL CLOSED; read-back mismatch (observed != requested) → Err(OsErr::ReadBackMismatch) FAIL CLOSED"
    system_safety: "SetThreadGroupAffinity restricts which logical CPUs the thread can run on. If the mask is wrong, the thread may be descheduled or pinned to a contended core, degrading performance. This is a performance hazard, not a memory-safety hazard. The bounds checks on group and mask prevent invalid masks from reaching the API."
    invalidation: "if Reserved is not [0;3], SetThreadGroupAffinity may fail or set the wrong affinity; if group/mask bounds checks are removed, an invalid group id or mask could cause ERROR_INVALID_PARAMETER or pin the thread to nonexistent CPUs; if assume_init() is called on prev/observed before checking return != 0, the struct is uninitialised garbage"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:1121 fn set_priority — SetPriorityClass + GetPriorityClass + GetCurrentProcess + GetLastError"
    compiler_cannot_verify: "FFI call correctness; that the priority-class constants match Win32 header values"
    callee_preconditions: "SetPriorityClass requires a valid process handle and a valid priority-class constant; GetPriorityClass requires a valid process handle"
    safe_code_establishes: "GetCurrentProcess returns a pseudo-handle, always valid; class is one of NORMAL_PRIORITY_CLASS (0x20), HIGH_PRIORITY_CLASS (0x80), REALTIME_PRIORITY_CLASS (0x100) — all valid Win32 constants; GetPriorityClass return is checked for 0 (failure) before matching"
    failure_modes: "SetPriorityClass returns 0 → Err(OsErr::Win32) FAIL CLOSED; GetPriorityClass returns 0 → Err(OsErr::Win32) FAIL CLOSED; read-back mismatch (observed class != requested) → Err(OsErr::ReadBackMismatchU32) FAIL CLOSED"
    system_safety: "HIGH_PRIORITY_CLASS elevates the process's scheduling priority above normal processes, potentially starving lower-priority work (including the kernel's network stack if REALTIME). This adapter uses HIGH_PRIORITY_CLASS, NOT REALTIME — per operator directive. REALTIME_PRIORITY_CLASS is available in the enum but the operator has reserved its use for explicit approval. If REALTIME is requested, the adapter sets it but the caller is responsible for the system impact."
    invalidation: "if the priority-class constants are wrong (e.g. typo in hex), SetPriorityClass would set the wrong priority or fail; if the read-back check is removed, a silent no-op (priority not changed) would go undetected"

  - block: "rust/crates/pump-quant-core/src/cpu_numa_tuning.rs:1210 unsafe fn lock_region — VirtualLock + GetLastError"
    compiler_cannot_verify: "FFI call correctness; that ptr points to a live committed region; that the page-aligned range is within the process's address space"
    callee_preconditions: "VirtualLock requires a pointer to a committed region and a byte count; the region must remain allocated until VirtualUnlock. The # Safety contract on the trait method requires the caller to prove this."
    safe_code_establishes: "len != 0 checked; locked_total + len <= lock_budget checked; ptr + len overflow checked (checked_add); page-aligned: start rounded DOWN to page boundary, end rounded UP — both derived from GetSystemInfo.dwPageSize; working-set minimum raised before the call (else ERROR_WORKING_SET_QUOTA 1453); aligned_len returned so the budget tracks the actual locked bytes, not the requested bytes"
    failure_modes: "VirtualLock returns 0 → Err(OsErr::Win32) with GetLastError, or Err(OsErr::WorkingSetQuota) if code == 1453. FAIL CLOSED — the region is not locked, the error propagates."
    system_safety: "VirtualLock pins the page-aligned region as non-pageable, consuming physical memory. The byte budget is explicit and justified in the dossier. Against a 383.6 GB commit limit, a few MB of locked pages is negligible. If the budget were set to a large fraction of commit, it would pressure the kernel's memory manager. The lock_budget is the control."
    invalidation: "if the page alignment is removed, VirtualLock may lock partial pages (UB or ERROR); if the working-set raise is skipped, VirtualLock fails with ERROR 1453; if the ALIGNED length is not returned, the budget silently under-counts locked bytes; if the # Safety contract is violated by the caller (dangling ptr), VirtualLock is UB"
