      //     if (t.physical_cores as usize) < hot.len() { return Err(PlanError::Insufficient); }
      //
      //     // rank physical cores: prefer higher efficiency_class (perf cores), then stable by id.
      //     let mut cores: Vec<&Core> = t.all_cores().collect();
      //     cores.sort_by(|a, b| b.efficiency_class.cmp(&a.efficiency_class)
      //                             .then(a.physical_id.cmp(&b.physical_id)));
      //
      //     let mut assignments = ArrayVec::new();
      //     let mut hot_mask = 0u64;      // (single-group model; extend to per-group for >64 CPUs)
      //     let mut idle_mask = 0u64;
      //     let group = cores[0].group;   // pin the hot set within one group; never span groups
      //
      //     for (spec, core) in hot.iter().zip(cores.iter()) {
      //         if core.group != group { return Err(PlanError::MultiGroupSpan); }
      //         let one = core.logical_mask & core.logical_mask.wrapping_neg(); // lowest set bit
      //         assignments.push((spec.thread_id(), GroupAffinity { group, mask: one }));
      //         hot_mask |= one;
      //         idle_mask |= core.logical_mask & !one; // SMT siblings of hot cores -> reserved idle
      //     }
      //
      //     // control = every CPU in the group not hot and not reserved-idle.
      //     let group_all = t.group_mask(group);
      //     let control_mask_bits = group_all & !hot_mask & !idle_mask;
      //
      //     // pairwise-disjoint invariant the test pins:
      //     debug_assert_eq!(hot_mask & idle_mask, 0);
      //     debug_assert_eq!(hot_mask & control_mask_bits, 0);
      //     debug_assert_eq!(idle_mask & control_mask_bits, 0);
