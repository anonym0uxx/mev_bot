leaves:
- leaf_id: decode_pump_curve_identity_and_fields
  responsibility: Decode a pump.fun BondingCurve account into typed integer reserves, failing closed on identity/bounds/bool violations.
  signature: 'pub fn decode_pump_curve(account: &[u8]) -> Option<PumpCurve>'
  invariants:
  - A 49-byte buffer whose 0..8 discriminator equals the PumpFun account discriminator [23,183,248,55,96,216,172,96] decodes to Some with virtual_token@8, virtual_sol@16, real_token@24, real_sol@32 read as u64 little-endian and complete = (byte48==1).
  - '§18.2 fail-closed: an otherwise-valid 49-byte buffer whose discriminator is all-zero, the foreign PumpSwap discriminator, or a single-bit-flipped PumpFun discriminator yields None.'
  - A `complete` byte at offset 48 that is neither 0 nor 1 (e.g. 2, 128, 255) yields None even with a correct discriminator.
  - Any buffer shorter than 49 bytes yields None regardless of contents, before any field is trusted (49 is the minimum valid length).
  reference_pattern: property_test is the sole correctness authority; authored and self-verified to compile and pass against the committed implementation.
  property_test: |
    #[test]
    fn decode_pump_curve_identity_and_fields() {
        const PF_DISC: [u8; 8] = [23, 183, 248, 55, 96, 216, 172, 96];
        const PS_DISC: [u8; 8] = [241, 154, 109, 4, 17, 177, 109, 188];
        fn curve_bytes(
            disc: [u8; 8],
            v_token: u64,
            v_sol: u64,
            r_token: u64,
            r_sol: u64,
            complete: u8,
        ) -> Vec<u8> {
            let mut b = vec![0u8; 49];
            b[0..8].copy_from_slice(&disc);
            b[8..16].copy_from_slice(&v_token.to_le_bytes());
            b[16..24].copy_from_slice(&v_sol.to_le_bytes());
            b[24..32].copy_from_slice(&r_token.to_le_bytes());
            b[32..40].copy_from_slice(&r_sol.to_le_bytes());
            b[48] = complete;
            b
        }
        let samples: [(u64, u64, u64, u64); 4] = [
            (0, 0, 0, 0),
            (100, 200, 300, 400),
            (
                1_072_000_000_000_000,
                30_000_000_000,
                793_100_000_000_000,
                0,
            ),
            (u64::MAX, u64::MAX, u64::MAX, u64::MAX),
        ];
        for &(vt, vs, rt, rs) in samples.iter() {
            for &flag in &[0u8, 1u8] {
                let b = curve_bytes(PF_DISC, vt, vs, rt, rs, flag);
                let c = decode_pump_curve(&b).expect("valid identity must decode");
                assert_eq!(c.virtual_token, vt);
                assert_eq!(c.virtual_sol, vs);
                assert_eq!(c.real_token, rt);
                assert_eq!(c.real_sol, rs);
                assert_eq!(c.complete, flag == 1);
            }
        }
        let c = decode_pump_curve(&curve_bytes(PF_DISC, 5, 6, 7, 8, 1)).unwrap();
        assert_eq!(c.virtual_token, 5);
        assert_eq!(c.virtual_sol, 6);
        assert_eq!(c.real_token, 7);
        assert_eq!(c.real_sol, 8);
        assert!(c.complete);
        assert!(decode_pump_curve(&curve_bytes([0u8; 8], 5, 6, 7, 8, 0)).is_none());
        assert!(decode_pump_curve(&curve_bytes(PS_DISC, 5, 6, 7, 8, 0)).is_none());
        let mut flipped = PF_DISC;
        flipped[0] ^= 0x01;
        assert!(decode_pump_curve(&curve_bytes(flipped, 5, 6, 7, 8, 0)).is_none());
        for bad in [2u8, 3, 128, 255] {
            assert!(decode_pump_curve(&curve_bytes(PF_DISC, 1, 2, 3, 4, bad)).is_none());
        }
        for len in 0..49usize {
            let short = vec![PF_DISC[0]; len];
            assert!(
                decode_pump_curve(&short).is_none(),
                "len {} must be rejected",
                len
            );
        }
        let mut nearly = curve_bytes(PF_DISC, 1, 2, 3, 4, 0);
        nearly.truncate(48);
        assert!(decode_pump_curve(&nearly).is_none());
    }
- leaf_id: decode_pumpswap_pool_identity_and_fields
  responsibility: Decode a PumpSwap AMM Pool account into typed integer reserves, failing closed on identity/bounds violations.
  signature: 'pub fn decode_pumpswap_pool(account: &[u8]) -> Option<PumpSwapPool>'
  invariants:
  - A 35-byte buffer whose 0..8 discriminator equals the PumpSwap account discriminator [241,154,109,4,17,177,109,188] decodes to Some with pool_bump@8 (u8), index@9 (u16 LE), base_reserve@11, quote_reserve@19, lp_supply@27 (u64 LE) at their documented offsets.
  - Full-width extremes (u8::MAX bump, u16::MAX index, u64::MAX reserves) decode exactly with no truncation or overflow.
  - '§18.2 fail-closed: an otherwise-valid 35-byte buffer with an all-zero, foreign PumpFun, or single-bit-flipped discriminator yields None.'
  - Any buffer shorter than 35 bytes yields None regardless of contents; trailing bytes beyond offset 35 are ignored, not rejected.
  reference_pattern: property_test is the sole correctness authority; authored and self-verified to compile and pass against the committed implementation.
  property_test: |
    #[test]
    fn decode_pumpswap_pool_identity_and_fields() {
        const PF_DISC: [u8; 8] = [23, 183, 248, 55, 96, 216, 172, 96];
        const PS_DISC: [u8; 8] = [241, 154, 109, 4, 17, 177, 109, 188];
        fn pool_bytes(disc: [u8; 8], bump: u8, index: u16, base: u64, quote: u64, lp: u64) -> Vec<u8> {
            let mut b = vec![0u8; 35];
            b[0..8].copy_from_slice(&disc);
            b[8] = bump;
            b[9..11].copy_from_slice(&index.to_le_bytes());
            b[11..19].copy_from_slice(&base.to_le_bytes());
            b[19..27].copy_from_slice(&quote.to_le_bytes());
            b[27..35].copy_from_slice(&lp.to_le_bytes());
            b
        }
        let samples: [(u8, u16, u64, u64, u64); 4] = [
            (0, 0, 0, 0, 0),
            (254, 7, 123_456_789, 987_654_321, 1_000_000),
            (255, 65_535, u64::MAX, u64::MAX, u64::MAX),
            (1, 513, 1, 2, 3),
        ];
        for &(bump, index, base, quote, lp) in samples.iter() {
            let b = pool_bytes(PS_DISC, bump, index, base, quote, lp);
            let p = decode_pumpswap_pool(&b).expect("valid identity must decode");
            assert_eq!(p.pool_bump, bump);
            assert_eq!(p.index, index);
            assert_eq!(p.base_reserve, base);
            assert_eq!(p.quote_reserve, quote);
            assert_eq!(p.lp_supply, lp);
        }
        let p = decode_pumpswap_pool(&pool_bytes(
            PS_DISC,
            u8::MAX,
            u16::MAX,
            u64::MAX,
            u64::MAX,
            u64::MAX,
        ))
        .unwrap();
        assert_eq!(p.pool_bump, 255);
        assert_eq!(p.index, 65_535);
        assert_eq!(p.base_reserve, u64::MAX);
        assert_eq!(p.quote_reserve, u64::MAX);
        assert_eq!(p.lp_supply, u64::MAX);
        assert!(decode_pumpswap_pool(&pool_bytes([0u8; 8], 1, 2, 3, 4, 5)).is_none());
        assert!(decode_pumpswap_pool(&pool_bytes(PF_DISC, 1, 2, 3, 4, 5)).is_none());
        let mut flipped = PS_DISC;
        flipped[7] ^= 0x80;
        assert!(decode_pumpswap_pool(&pool_bytes(flipped, 1, 2, 3, 4, 5)).is_none());
        for len in 0..35usize {
            let short = vec![PS_DISC[len % 8]; len];
            assert!(
                decode_pumpswap_pool(&short).is_none(),
                "len {} must be rejected",
                len
            );
        }
        let mut nearly = pool_bytes(PS_DISC, 1, 2, 3, 4, 5);
        nearly.truncate(34);
        assert!(decode_pumpswap_pool(&nearly).is_none());
        let mut extra = pool_bytes(PS_DISC, 9, 10, 11, 12, 13);
        extra.extend_from_slice(&[7u8; 40]);
        let p = decode_pumpswap_pool(&extra).unwrap();
        assert_eq!(p.base_reserve, 11);
        assert_eq!(p.lp_supply, 13);
    }
