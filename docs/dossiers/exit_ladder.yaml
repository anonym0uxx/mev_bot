  - leaf_id: el_exit_into_strength
    responsibility: "burst-climax exit trigger: fire the pre-armed exit into detected buy-pressure spurts"
    signature: >
      pub fn exit_into_strength_fires(burst: &BurstState, in_profit: bool,
      authenticity_fp: u32, min_authenticity_fp: u32) -> bool
    invariants:
      - "fires only on BurstPhase::Climax with favorable (buy-side) direction while in profit"
      - "never fires on flow below the authenticity threshold (fabricated bursts are what vendors sell)"
      - "pure; competes against post-confirmation exits in the evaluator — this leaf only detects, never sizes"
    reference_pattern: |
      // matches!(burst.phase, BurstPhase::Climax)
      //   && burst.direction == Dir::Buy
      //   && in_profit
      //   && authenticity_fp >= min_authenticity_fp
    property_test: |
      #[test]
      fn prop_fires_only_on_authentic_climax_in_profit() {
          let climax = BurstState::test(BurstPhase::Climax, Dir::Buy);
          assert!(exit_into_strength_fires(&climax, true, 9_000, 5_000));
          assert!(!exit_into_strength_fires(&climax, false, 9_000, 5_000)); // not in profit
          assert!(!exit_into_strength_fires(&climax, true, 1_000, 5_000)); // fabricated burst
          let onset = BurstState::test(BurstPhase::Onset, Dir::Buy);
          assert!(!exit_into_strength_fires(&onset, true, 9_000, 5_000));
      }
    max_lines: 15
    temperature_band: low
