component: exit_ladder
constitution_refs: ["§24", "§35", "§48", "criteria 102, 103, 107"]
spec: >
  The scalp exit execution family: pre-armed byte-level exit transactions, the salvaged
  5-level sell-escalation ladder, partial-exit ladders sized from measured depth, per-market
  derived profit targets (measured round-trip cost floor + configured margin — no global TP
  constants, defect #3), whole-lifecycle exit protection with a never-freezing peak reference
  (defects #1/#2), and the exit-into-strength trigger interface. Trigger-time work is
  patch-sign-send: message skeletons are pre-serialized with blockhash / amount / min-out
  patched in place at fixed offsets. Escalation cooldowns scale with measured price-decay
  urgency (the single permitted dynamic safety constant). All arithmetic integer fixed-point.
invariants:
  - "no f32/f64 in any amount, price, bps, or fee field"
  - "an exit template exists for every open position from the moment of entry (pre-armed law)"
  - "patching a template never changes its length or any unpatched byte (fixed-offset contract)"
  - "escalation only widens tolerance / raises priority — it never reduces exit aggressiveness mid-collapse"
  - "profit targets are per-market derived: target_bps >= measured_floor_bps + margin_bps always holds"
adversarial_checks:
  - "patch offsets computed once at arm time remain valid after blockhash refresh (no re-serialization drift)"
  - "ladder at max escalation with a failing route still emits a final emergency-path attempt (never a silent stall)"
  - "a market whose measured floor exceeds any configured global TP would have produced a guaranteed net-loss target — derived targets make this impossible by construction (defect #3 regression)"
  - "cooldown under fast price decay is strictly shorter than cooldown under slow decay (urgency scaling)"
benchmark:
  bench_name: exit_ladder_bench
  budgets_ns:
    p50_ns: 300.0
    p99_ns: 1200.0

leaves:
