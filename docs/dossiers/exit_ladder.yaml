  - leaf_id: el_patch_sign
    responsibility: "trigger-time in-place patch of blockhash/amount/min_out, then sign: the entire sell hot path"
    signature: >
      pub fn patch_and_finalize(t: &mut ExitTemplate, blockhash: &[u8; 32],
      amount: u64, min_out: u64) -> Result<(), PatchError>
    invariants:
      - "writes exactly 32 bytes at blockhash_off and 8 at amount_off / min_out_off; nothing else"
      - "no allocation, no serialization framework, no syscalls"
      - "idempotent: patching twice with the same values yields identical bytes"
    reference_pattern: |
      // t.msg_bytes[t.blockhash_off..t.blockhash_off+32].copy_from_slice(blockhash);
      // t.msg_bytes[t.amount_off..t.amount_off+8].copy_from_slice(&amount.to_le_bytes());
      // t.msg_bytes[t.min_out_off..t.min_out_off+8].copy_from_slice(&min_out.to_le_bytes());
    property_test: |
      #[test]
      fn prop_patch_idempotent_and_exact() {
          let mut t = arm_exit_template(&ExitAccounts::test(), &ExitParams::test()).unwrap();
          let bh = [7u8; 32];
          patch_and_finalize(&mut t, &bh, 123, 100).unwrap();
          let snap = t.msg_bytes.clone();
          patch_and_finalize(&mut t, &bh, 123, 100).unwrap();
          assert_eq!(snap, t.msg_bytes);
          assert_eq!(&t.msg_bytes[t.blockhash_off..t.blockhash_off + 32], &bh);
      }
    depends_on: ["el_template_arm"]
    max_lines: 20
    temperature_band: low

  - leaf_id: el_target_derive
    responsibility: "derive the per-market profit target from the measured round-trip floor plus margin (defect #3 fix)"
    signature: >
      pub fn derive_target_bps(floor_bps: u32, margin_bps: u32,
      mfe_p25_bps: Option<u32>) -> Option<u32>
    invariants:
      - "returns None (market inadmissible) when floor_bps + margin_bps exceeds the archetype's conditional MFE evidence (mfe_p25_bps) where present (criterion 107 linkage)"
      - "target >= floor + margin always; no global constant path exists"
      - "checked add; None on overflow"
    reference_pattern: |
      // let t = floor_bps.checked_add(margin_bps)?;
      // match mfe_p25_bps { Some(m) if m < t => None, _ => Some(t) }
    property_test: |
      #[test]
      fn prop_target_above_floor_or_inadmissible() {
          assert_eq!(derive_target_bps(200, 100, Some(500)), Some(300));
          assert_eq!(derive_target_bps(200, 100, Some(250)), None); // MFE can't pay the floor
          assert_eq!(derive_target_bps(200, 100, None), Some(300));
          assert_eq!(derive_target_bps(u32::MAX, 1, None), None); // overflow
      }
    max_lines: 15
    temperature_band: low

  - leaf_id: el_peak_protect
    responsibility: "whole-lifecycle protection state: trail reference from the true running peak, armed from entry (defects #1/#2 fix)"
    signature: >
      pub fn protection_level_fp(peak_price_fp: u64, entry_price_fp: u64,
      trail_bps: u32, hard_sl_bps: u32) -> u64
    invariants:
      - "protection exists from entry (max of trail-from-peak and hard-SL-from-entry) — no TP2-gated dead zone"
      - "monotone in peak: a higher peak never lowers the protection level"
      - "integer bps math, saturating at zero"
    reference_pattern: |
      // trail_level = peak * (10_000 - trail_bps) / 10_000
      // sl_level    = entry * (10_000 - hard_sl_bps) / 10_000
      // max(trail_level, sl_level)
    property_test: |
      #[test]
      fn prop_protection_whole_life_monotone() {
          let p0 = protection_level_fp(1_000, 1_000, 500, 800);
          assert!(p0 > 0); // armed at entry, not after TP2
          let p1 = protection_level_fp(2_000, 1_000, 500, 800);
          assert!(p1 >= p0); // peak up -> protection never down
          assert!(
              protection_level_fp(2_000, 1_000, 500, 800) >= protection_level_fp(1_000, 1_000, 500, 800)
          );
      }
    max_lines: 20
    temperature_band: low

  - leaf_id: el_escalation
    responsibility: "5-level sell-escalation state machine with decay-urgency-scaled cooldown (salvaged semantics)"
    signature: >
      pub fn next_escalation(cur: EscalationState, attempt_failed: bool,
      decay_bps_per_s: u32, base_cooldown_ms: u32) -> EscalationState
    invariants:
      - "levels 0..=4 strictly increase slippage tolerance and priority fee; level transitions only on failure"
      - "cooldown_ms = base scaled DOWN by measured decay urgency (faster collapse => shorter wait), floor at a configured minimum"
      - "at level 4 with attempt_failed, state marks emergency_path_required = true; the machine never returns to a lower level mid-position"
      - "pure state machine; retry counts bounded (safety constant retained static-by-design)"
    reference_pattern: |
      // let urgency = decay_bps_per_s.max(1);
      // let cooldown = (base_cooldown_ms / urgency.min(MAX_URGENCY_DIV)).max(MIN_COOLDOWN_MS);
      // if attempt_failed { level = (level + 1).min(4); if level == 4 { emergency_path_required = true } }
    property_test: |
      #[test]
      fn prop_escalation_monotone_and_urgent() {
          let s0 = EscalationState::new(1_000);
          let s1 = next_escalation(s0, true, 1, 1_000);
          let s2 = next_escalation(s1, true, 1, 1_000);
          assert!(s2.level > s1.level && s1.level > s0.level);
          let slow = next_escalation(s0, true, 1, 1_000).cooldown_ms;
          let fast = next_escalation(s0, true, 100, 1_000).cooldown_ms;
          assert!(fast < slow); // collapse => shorter cooldown (defect-list exception)
          let mut s = s0;
          for _ in 0..10 {
              s = next_escalation(s, true, 10, 1_000);
          }
          assert_eq!(s.level, 4);
          assert!(s.emergency_path_required);
      }
    max_lines: 45
    temperature_band: low

  - leaf_id: el_partial_ladder
    responsibility: "size a partial-exit ladder cost-priced against per-rung fixed cost, not impact alone (criterion 112)"
    signature: >
      pub fn ladder_rungs(position_lamports: u64, max_rung_impact_bps: u32,
      fixed_cost_lamports: u64, min_rung_margin_bps: u32,
      impact_curve: &ImpactCurve) -> ArrayVec<u64, MAX_RUNGS>
    invariants:
      - "sum of rungs == position_lamports exactly (no dust lost)"
      - "each rung's modeled impact <= max_rung_impact_bps per the supplied measured curve"
      - "COST PRICING: a rung is only added if its share of the position still clears the fixed cost it pays with min_rung_margin_bps of margin — splitting that drives any rung below fixed_cost_lamports/margin is refused, because each rung pays full fixed cost while linear impact is barely reduced by splitting (criterion 112)"
      - "at most MAX_RUNGS rungs; a position too small to carry two rungs above the fixed-cost floor returns exactly one (single-clip exit)"
      - "no allocation; deterministic"
    reference_pattern: |
      // UNVERIFIED FRONTIER REFERENCE (Fable). Not compiled here. property_test is authority.
      //
      // use arrayvec::ArrayVec;
      // pub const MAX_RUNGS: usize = 8;
      //
      // pub fn ladder_rungs(position_lamports: u64, max_rung_impact_bps: u32,
      //                     fixed_cost_lamports: u64, min_rung_margin_bps: u32,
      //                     impact_curve: &ImpactCurve) -> ArrayVec<u64, MAX_RUNGS>
      // {
      //     let mut rungs = ArrayVec::<u64, MAX_RUNGS>::new();
      //     if position_lamports == 0 { return rungs; }
      //
      //     // (1) impact ceiling: largest rung whose modeled impact stays within the bound.
      //     let impact_cap = impact_curve.max_size_at(max_rung_impact_bps).max(1);
      //     // (2) cost floor per rung: a rung must be large enough that the fixed cost it pays
      //     //     is <= min_rung_margin_bps of the rung. rung >= fixed * 10_000 / margin_bps.
      //     let cost_floor = if min_rung_margin_bps == 0 { u64::MAX }
      //         else { (fixed_cost_lamports as u128 * 10_000u128
      //                 / min_rung_margin_bps as u128) as u64 };
      //     // (3) the per-rung size must satisfy BOTH: big enough to clear cost, small enough
      //     //     for impact. If cost_floor > impact_cap the constraints conflict -> one clip.
      //     if cost_floor > impact_cap || position_lamports <= cost_floor {
      //         rungs.push(position_lamports);        // too small to split profitably
      //         return rungs;
      //     }
      //     let per_rung = impact_cap;                 // largest impact-safe rung
      //     // max rungs the cost floor permits: position / cost_floor
      //     let cost_limited = (position_lamports / cost_floor).max(1);
      //     let impact_needed = position_lamports.div_ceil(per_rung);
      //     let count = impact_needed.min(cost_limited)
      //                              .min(MAX_RUNGS as u64) as usize;
      //     let base = position_lamports / count as u64;
      //     let mut assigned = 0u64;
      //     for i in 0..count {
      //         let rung = if i + 1 == count { position_lamports - assigned } else { base };
      //         assigned += rung;
      //         rungs.push(rung);
      //     }
      //     rungs
      // }
      //
      // The reliability benefit of more rungs under a collapsing book is real but lives in the
      // CALLER's policy (el_escalation), which may raise rung count within this cost-priced
      // ceiling when reconciled evidence shows the reliability gain beats the fixed-cost penalty.
    property_test: |
      #[test]
      fn prop_rungs_conserve_bound_and_cost_priced() {
          let c = ImpactCurve::linear_test(1_000); // 1_000 lamports per bps
                                                   // fixed cost 100 lamports, require each rung margin >= 200 bps -> rung >= 5_000
          let rungs = ladder_rungs(20_000, 4, 100, 200, &c);
          assert_eq!(rungs.iter().sum::<u64>(), 20_000);
          for r in &rungs {
              assert!(*r >= 5_000, "every rung clears the fixed-cost floor");
              assert!(c.impact_bps(*r) <= 4 || rungs.len() == MAX_RUNGS);
          }
          // a position only twice the cost floor cannot profitably split -> one clip
          let tiny = ladder_rungs(6_000, 4, 100, 200, &c);
          assert_eq!(tiny.len(), 1);
          assert_eq!(tiny[0], 6_000);
          // zero-margin sentinel also collapses to a single clip (no free splitting)
          let z = ladder_rungs(20_000, 4, 100, 0, &c);
          assert_eq!(z.len(), 1);
      }
