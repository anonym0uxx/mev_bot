name: rust-ci

# Rust-only CI: every PR to main must fmt, clippy-clean, build, and pass tests on the
# portable profile. (The retired supervisor/constitution gate steps - dossier verify via
# materialize_tests.py and the ci_gate.py hot-path lint - were removed with the governance.)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

# CI-only CPU baseline. The DEPLOYMENT pin stays where it is:
#   rust/.cargo/config.toml -> rustflags = ["-C","target-cpu=znver5"]   (operator SS24, criterion 109)
# Hosted runners are NOT Zen5, and because cargo is invoked without --target the config
# rustflags also apply to build scripts / proc-macros, whose compiled code then SIGILLs the
# compiler. RUSTFLAGS overrides build.rustflags, so this replaces ONLY the CPU target for CI;
# every other flag and `-D warnings` are unchanged. Nothing about the deployment build changes.
env:
  RUSTFLAGS: "-C target-cpu=x86-64-v3"
  CARGO_TERM_COLOR: always

jobs:
  portable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (portable profile)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Record toolchain / runner CPU / effective flags
        id: env
        working-directory: rust
        run: |
          set -euo pipefail
          rel="$(rustc -vV | sed -n 's/^release: //p')"
          echo "rustc_release=${rel}" >> "$GITHUB_OUTPUT"
          echo "--- toolchain ---"; rustc -vV
          echo "--- runner CPU ---"; grep -m1 'model name' /proc/cpuinfo || echo "(model name unavailable)"
          echo "--- runner CPU flags (first 400 chars) ---"; grep -m1 '^flags' /proc/cpuinfo | cut -c1-400 || true
          echo "--- effective RUSTFLAGS ---"; echo "${RUSTFLAGS:-<unset>}"
          echo "--- rust/.cargo/config.toml (deployment pin, unchanged) ---"; cat .cargo/config.toml
          echo "--- tested merge sha ---"; git rev-parse HEAD

      # Cache is separated by toolchain (rustc release), target (os/arch) and flags
      # (config.toml + this workflow's hash), so a flag or toolchain change cannot reuse
      # a stale build.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust${{ steps.env.outputs.rustc_release }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}-${{ hashFiles('rust/.cargo/config.toml','.github/workflows/gate.yml') }}

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (portable/dev profile)
        working-directory: rust
        run: cargo build --workspace

      - name: Tests
        working-directory: rust
        run: cargo test --workspace
