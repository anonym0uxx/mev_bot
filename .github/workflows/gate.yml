name: hermes-gate

# The server-side half of the automation: every PR to main is gated by the SAME supervisor
# checks the local driver runs, on the portable profile. Merge is allowed only when this is
# green (pair with a branch-protection rule requiring this check). This is what makes
# `auto_build.py --auto-merge` safe: CI, not the model, authorizes the merge.
#
# Phase-B-exclusive criteria (bench/latency/PGO/tuning, §9.5) are NOT validated here — CI runs on
# GitHub's Linux runners, which are not the deployment host. Those are certified on the server.
# This workflow enforces the portable-profile contract: it must build and pass tests and hygiene.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  portable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (portable profile)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (portable/dev profile)
        working-directory: rust
        run: cargo build --workspace

      - name: Tests
        working-directory: rust
        run: cargo test --workspace

      - name: Verify dossier tests unmodified (correctness authority integrity)
        run: python scripts/materialize_tests.py --repo . --verify

      - name: Supervisor portable gate (hot-path lint, no-stubs, secrets, dossier presence)
        run: |
          python -m pip install --quiet pyyaml || true
          python scripts/ci_gate.py --repo . --config supervisor/config/supervisor.yaml

      - name: Phase boundary assertion
        run: |
          echo "CI runs on a non-deployment host: Phase-B criteria (bench/latency/PGO/tuning)"
          echo "are intentionally NOT certified here. They are validated on the server."
