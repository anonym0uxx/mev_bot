name: rust-ci

# Rust-only CI: every PR to main must fmt, clippy-clean, build, and pass tests on the
# portable profile. (The retired supervisor/constitution gate steps — dossier verify via
# materialize_tests.py and the ci_gate.py hot-path lint — were removed with the governance.)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  portable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (portable profile)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (portable/dev profile)
        working-directory: rust
        run: cargo build --workspace

      - name: Tests
        working-directory: rust
        run: cargo test --workspace
