component: lifecycle
constitution_refs: []
spec: Independence-lock dossier for the `lifecycle` module of pump-quant-domain. Each leaf's property_test is the locked correctness authority over that leaf's public contract, verified to compile and pass against the committed Phase-A implementation. Decision logic is integer/deterministic (§22).
invariants: []
adversarial_checks: []
leaves:
- leaf_id: cls_transition_authority
  responsibility: Authoritative legal directed-edge set of the candidate lifecycle state machine (can_transition_to).
  signature: 'pub fn can_transition_to(self, next: CandidateLifecycleState) -> bool'
  invariants:
  - 'The set of legal directed edges over the 10x10 state grid is exactly the 24 documented edges: the 7-step forward happy path, the 3 re-evaluation fallbacks (EntryEligible->Evaluating, EntryEligible->Observing, Evaluating->Observing), the 2 failure->Archived edges, and the 12 failure-escape edges (each of the 6 live pre-exit states to Rejected and to PermanentlyInvalidated).'
  - 'No edge outside this enumerated set is ever legal (fail-closed: unknown/backward/skip transitions are rejected).'
  - can_transition_to is a total, side-effect-free function agreeing with the independently transcribed edge set on every ordered pair.
  - Exactly 24 directed transitions are legal across the whole state space.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    #[test]
    fn cls_transition_authority_matches_edge_set() {
        use CandidateLifecycleState::*;
        let live = [
            Discovered,
            Observing,
            Evaluating,
            EntryEligible,
            Entered,
            Managing,
        ];
        let mut legal: std::collections::BTreeSet<(u8, u8)> = std::collections::BTreeSet::new();
        let base = [
            (Discovered, Observing),
            (Observing, Evaluating),
            (Evaluating, EntryEligible),
            (EntryEligible, Entered),
            (Entered, Managing),
            (Managing, Exited),
            (Exited, Archived),
            (EntryEligible, Evaluating),
            (EntryEligible, Observing),
            (Evaluating, Observing),
            (Rejected, Archived),
            (PermanentlyInvalidated, Archived),
        ];
        for (a, b) in base {
            legal.insert((a as u8, b as u8));
        }
        for s in live {
            legal.insert((s as u8, Rejected as u8));
            legal.insert((s as u8, PermanentlyInvalidated as u8));
        }
        // Exactly 24 legal directed edges.
        assert_eq!(legal.len(), 24);

        let mut count = 0u32;
        for from in CandidateLifecycleState::ALL {
            for to in CandidateLifecycleState::ALL {
                let want = legal.contains(&(from as u8, to as u8));
                assert_eq!(from.can_transition_to(to), want, "{from} -> {to}");
                if from.can_transition_to(to) {
                    count += 1;
                }
            }
        }
        assert_eq!(count, 24);
    }
- leaf_id: cls_state_predicates
  responsibility: Total predicates partitioning states by terminality, resting-failure, and capital-at-risk (is_terminal/is_failed/holds_position).
  signature: pub const fn is_terminal(self) -> bool; pub const fn is_failed(self) -> bool; pub const fn holds_position(self) -> bool
  invariants:
  - is_terminal is true for exactly one state, Archived.
  - is_failed is true for exactly the two resting failure states, Rejected and PermanentlyInvalidated.
  - holds_position is true for exactly the two capital-at-risk states, Entered and Managing.
  - is_terminal and is_failed are mutually exclusive for every state (Archived is terminal but not failed).
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    #[test]
    fn cls_state_predicates_partition() {
        use CandidateLifecycleState::*;
        let mut terminal = 0u32;
        let mut failed = 0u32;
        let mut holds = 0u32;
        for s in CandidateLifecycleState::ALL {
            assert_eq!(s.is_terminal(), s == Archived);
            assert_eq!(
                s.is_failed(),
                matches!(s, Rejected | PermanentlyInvalidated)
            );
            assert_eq!(s.holds_position(), matches!(s, Entered | Managing));
            // Terminal and failed are mutually exclusive.
            assert!(!(s.is_terminal() && s.is_failed()));
            if s.is_terminal() {
                terminal += 1;
            }
            if s.is_failed() {
                failed += 1;
            }
            if s.holds_position() {
                holds += 1;
            }
        }
        assert_eq!(terminal, 1);
        assert_eq!(failed, 2);
        assert_eq!(holds, 2);
        assert_eq!(CandidateLifecycleState::ALL.len(), 10);
    }
- leaf_id: cls_absorbing
  responsibility: 'Terminal/failure absorption rules: Archived is a sink, failure states archive only, and no state self-loops.'
  signature: 'pub fn can_transition_to(self, next: CandidateLifecycleState) -> bool'
  invariants:
  - Archived has zero legal successors (fully absorbing terminal state).
  - 'Each resting failure state (Rejected, PermanentlyInvalidated) has exactly one legal successor: Archived.'
  - No state has a legal self-transition (no self-loops).
  - A completed round-trip (Exited) may only be Archived; it can never be retroactively Rejected or PermanentlyInvalidated.
  reference_pattern: property_test is the sole correctness authority for this leaf; it was authored and verified to compile and pass against the committed implementation (no separate reference snippet).
  property_test: |
    #[test]
    fn cls_terminal_and_failure_are_absorbing() {
        use CandidateLifecycleState::*;
        // Archived never transitions.
        let mut archived_succ = 0u32;
        for to in CandidateLifecycleState::ALL {
            if Archived.can_transition_to(to) {
                archived_succ += 1;
            }
        }
        assert_eq!(archived_succ, 0);

        // Each resting failure state has exactly one successor: Archived.
        for from in [Rejected, PermanentlyInvalidated] {
            let mut succ = 0u32;
            for to in CandidateLifecycleState::ALL {
                assert_eq!(from.can_transition_to(to), to == Archived, "{from} -> {to}");
                if from.can_transition_to(to) {
                    succ += 1;
                }
            }
            assert_eq!(succ, 1);
        }

        // No self-loops anywhere.
        for s in CandidateLifecycleState::ALL {
            assert!(!s.can_transition_to(s), "self loop {s}");
        }

        // Exited proceeds only to archival, never retroactive failure.
        assert!(!Exited.can_transition_to(Rejected));
        assert!(!Exited.can_transition_to(PermanentlyInvalidated));
        assert!(Exited.can_transition_to(Archived));
    }
