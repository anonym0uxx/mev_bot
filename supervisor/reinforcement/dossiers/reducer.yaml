    invariants:
      - "a key <= watermark that was already applied returns Duplicate; a key below the low watermark returns Regression"
      - "a forward jump returns GapThenApply(missed_count) so the caller marks Completeness::Incomplete — never silently Apply"
      - "bounded memory: recent-key window is fixed-capacity with deterministic eviction"
