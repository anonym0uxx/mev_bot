    depends_on: ["rd_event_key"]
    max_lines: 45
    temperature_band: high

  - leaf_id: rd_apply
    responsibility: "pure market-state transition for one admitted canonical swap"
    signature: >
      pub fn apply(state: &MarketState, ev: &CanonEvent) -> MarketState
    invariants:
      - "updates reserves, last trade, flow aggregates, completeness — all integer fields"
      - "no allocation: MarketState is fixed-size; windows are fixed-capacity decayed summaries"
      - "reserve arithmetic goes through the fixedpoint component (mul_div), never inline float math"
      - "applying the same event to the same state twice yields the same result (referential transparency)"
    reference_pattern: |
      // let mut s = *state;
      // s.reserve_base  = ev.post_reserve_base;   // decoded post-state is authoritative
      // s.reserve_quote = ev.post_reserve_quote;
      // s.flow.apply(ev.side, ev.quote_lamports, ev.ts_ns);  // fixed-size decayed summary
      // s.last = LastTrade::from(ev);
      // s
    property_test: |
      #[test]
      fn prop_apply_pure_and_deterministic() {
          let s0 = MarketState::test();
          let ev = CanonEvent::test(10, 0, 0, 1);
          let a = apply(&s0, &ev);
          let b = apply(&s0, &ev);
          assert_eq!(a, b);
          assert_eq!(s0, MarketState::test()); // input untouched
      }
    depends_on: ["rd_event_key"]
    max_lines: 45
    temperature_band: low

  - leaf_id: rd_snapshot_hash
    responsibility: "order-stable state hash for replay-parity assertion"
    signature: >
      pub fn state_hash(state: &WorldState) -> [u8; 32]
    invariants:
      - "iterates markets in sorted key order; two hashes of the same logical state are equal within and across processes"
      - "hash input is the canonical little-endian field serialization, versioned with a schema byte"
      - "no floats hashed anywhere (there are none in state)"
    reference_pattern: |
      // let mut keys: ArrayVec<_, MAX> = state.market_keys().collect();
      // keys.sort_unstable();
      // let mut h = Hasher::new(); h.update(&[SCHEMA_V]);
      // for k in keys { h.update(&k.to_le_bytes()); state.market(k).write_canon(&mut h); }
      // h.finalize()
    property_test: |
      #[test]
      fn prop_hash_order_stable() {
          let mut w1 = WorldState::new();
          let mut w2 = WorldState::new();
          for i in 0..100u64 { w1.upsert_market(i, MarketState::test_with(i)); }
          for i in (0..100u64).rev() { w2.upsert_market(i, MarketState::test_with(i)); }
          assert_eq!(state_hash(&w1), state_hash(&w2)); // insertion order irrelevant
          assert_eq!(state_hash(&w1), state_hash(&w1)); // stable within process
      }
    depends_on: ["rd_apply"]
    max_lines: 35
    temperature_band: low

  - leaf_id: rd_quantize_boundary
    responsibility: "fixed-point quantization boundary for off-hot-path features entering the reducer"
    signature: >
      pub fn quantize_feature(raw_f64: f64, scale: u32) -> Option<i64>
    invariants:
      - "this is the ONLY function where an f64 may appear, and it lives outside the hot module (boundary adapter)"
      - "NaN/inf/out-of-range -> None (feature marked incomplete), never a fabricated value"
      - "round-half-away-from-zero, documented and tested — a single rounding contract everywhere"
    reference_pattern: |
      // if !raw.is_finite() { return None; }
      // let scaled = raw * scale as f64;
      // if scaled.abs() > i64::MAX as f64 / 2.0 { return None; }
      // Some(scaled.round() as i64)   // .round() is half-away-from-zero in Rust
    property_test: |
      #[test]
      fn prop_quantize_contract() {
          assert_eq!(quantize_feature(1.25, 100), Some(125));
          assert_eq!(quantize_feature(-1.255, 1000), Some(-1255));
          assert_eq!(quantize_feature(f64::NAN, 100), None);
          assert_eq!(quantize_feature(f64::INFINITY, 100), None);
          assert_eq!(quantize_feature(0.5, 1), Some(1)); // half away from zero
      }
    max_lines: 15
    temperature_band: low
