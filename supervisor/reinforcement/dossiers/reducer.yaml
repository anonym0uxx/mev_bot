      //     if slot < seq.low_watermark { return Admit::Regression; }
      //     if slot < seq.next_expected {
      //         // within the recent window: either a known duplicate or a late-but-valid fill
      //         return if seq.seen(key) { Admit::Duplicate } else { Admit::Regression };
      //     }
      //     if slot == seq.next_expected {
      //         seq.remember(key);
      //         seq.next_expected = slot + 1;
      //         seq.low_watermark = seq.next_expected.saturating_sub(RECENT_CAP as u64);
      //         return Admit::Apply;
      //     }
      //     // slot > next_expected: forward jump
      //     let missed = slot - seq.next_expected;
      //     seq.remember(key);
      //     seq.next_expected = slot + 1;
      //     seq.low_watermark = seq.next_expected.saturating_sub(RECENT_CAP as u64);
      //     Admit::GapThenApply(missed)
