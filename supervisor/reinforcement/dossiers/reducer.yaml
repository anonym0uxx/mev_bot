component: reducer
constitution_refs: ["§14.4", "§22", "criterion 12, 13"]
spec: >
  The deterministic event-sourced core: canonical decoded events applied by pure transition
  functions to versioned state. Identical event sequences produce bit-identical state and
  decisions (criterion 12); live, shadow, and replay share this exact code (criterion 13).
  No clocks, no IO, no RNG, no HashMap iteration-order dependence, no floats in
  outcome-controlling state, zero heap allocation per event. Duplicates are dropped
  deterministically; gaps mark state INCOMPLETE — never fabricated. State is snapshot-hashable
  for replay-parity assertion.
invariants:
  - "apply() is pure: (State, Event) -> State with no side effects, allocation, or ambient reads"
  - "same event slice => same final state hash, across runs, threads, and machines"
  - "iteration over any keyed collection uses a deterministic order (sorted keys or index vec) wherever it affects output"
  - "gap in (slot, seq) sets Completeness::Incomplete on affected markets; no value is invented"
  - "no f32/f64 in State; money u64/u128 lamports; ratios bps"
adversarial_checks:
  - "shuffled duplicate deliveries of the same events produce the same state as exactly-once delivery"
  - "a state containing a HashMap hashed via unordered iteration would produce run-varying hashes — the snapshot hash test run twice in one process must be equal"
  - "an event with slot regression (earlier than watermark) is rejected deterministically, not applied"
benchmark:
  bench_name: reducer_bench
  budgets_ns:
    p50_ns: 250.0
    p99_ns: 900.0

leaves:
  - leaf_id: rd_event_key
    responsibility: "canonical event identity and ordering key for dedup and sequencing"
    signature: >
      pub fn event_key(ev: &CanonEvent) -> EventKey  // (slot: u64, tx_index: u32, inner_index: u16, source_seq: u64)
    invariants:
      - "total order: two distinct on-chain events never share a key; the same event from two sources shares one"
      - "Ord/Eq derive from on-chain position (slot, tx_index, inner_index), never from arrival time or source"
      - "Copy, 24 bytes max, no allocation"
    reference_pattern: |
      // #[derive(Copy, Clone, PartialEq, Eq, PartialOrd, Ord, Hash)]
      // pub struct EventKey { slot: u64, tx_index: u32, inner_index: u16 }
      // source_seq is carried for telemetry but excluded from Eq/Ord.
    property_test: |
      #[test]
      fn prop_key_source_independent() {
          let a = CanonEvent::test(100, 5, 0, /*source_seq*/ 1);
          let b = CanonEvent::test(100, 5, 0, /*source_seq*/ 999);
          assert_eq!(event_key(&a), event_key(&b));
          let c = CanonEvent::test(100, 6, 0, 1);
          assert!(event_key(&a) < event_key(&c));
      }
    max_lines: 20
    temperature_band: low

