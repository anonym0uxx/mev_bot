component: social_earn
constitution_refs: ['22', '29', '82', '99']
spec: >
  Independence-lock dossier for the `social_earn` module of pump-quant-app: the loop
  that closes the dormant D1-D10 source-quality feedback. It attributes each
  market's realized net-SOL back to the sources that called it and reconciles them
  (§82, evaluator::social_ledger, which rejects look-ahead grading) into an earned
  favorable-rate that supersedes the PUBLIC_BURNED baseline. Deterministic/integer
  (§22); earned-never-assumed — an unproven source stays undefined (§29.8); bounded
  tracking with oldest-eviction (§99).
invariants:
- An unproven source resolves to None (caller falls back to the PUBLIC_BURNED baseline).
- A favorable realized outcome earns a high favorable-rate; a loss earns zero.
- Outcomes for uncalled markets record nothing; tracking is bounded and deterministic.
adversarial_checks:
- A source with zero reconciled evidence must never earn a non-None quality.
- An outcome attributed to a mint no source called must not create a scorecard.
- Two identical call/outcome streams must produce identical earned quality.
leaves:
- leaf_id: se_earn
  responsibility: Earn per-source favorable-rate from reconciled realized outcomes; unproven stays None.
  signature: 'pub fn quality_bps_for(&self, source_id: u64) -> Option<u32>'
  invariants:
  - Favorable outcome -> Some(10_000); losing outcome -> Some(0); unproven -> None.
  - An outcome for an uncalled mint contributes no scorecard.
  reference_pattern: property_test is the sole correctness authority; authored and verified against the committed implementation.
  property_test: |
    #[test]
    fn se_earn_favorable_losing_and_unproven() {
        let mut e = SocialEarn::new(SocialEarnParams::standard());
        // Unproven source has no earned quality (baseline fallback).
        assert_eq!(e.quality_bps_for(42), None);
        // A favorable realized outcome earns the full favorable-rate.
        e.record_call(7, [1u8; 32], 1_000);
        e.record_outcome(&[1u8; 32], 5_000_000);
        e.reconcile();
        assert_eq!(e.quality_bps_for(7), Some(10_000));
        // A loss earns zero.
        e.record_call(9, [2u8; 32], 1_000);
        e.record_outcome(&[2u8; 32], -3_000_000);
        e.reconcile();
        assert_eq!(e.quality_bps_for(9), Some(0));
        // An outcome for a mint no source called records nothing.
        e.record_outcome(&[3u8; 32], 1);
        e.reconcile();
        assert_eq!(e.quality_bps_for(123), None);
    }

- leaf_id: se_bounded
  responsibility: Keep caller tracking bounded (evict weakest past track_cap) and deterministic.
  signature: 'pub fn record_call(&mut self, source_id: u64, mint: [u8; 32], call_ts_ns: u64)'
  invariants:
  - Exceeding track_cap evicts the mint with the fewest callers.
  - The same call/outcome stream always yields the same earned quality.
  reference_pattern: property_test is the sole correctness authority; authored and verified against the committed implementation.
  property_test: |
    #[test]
    fn se_bounded_eviction_and_determinism() {
        let params = SocialEarnParams {
            track_cap: 2,
            ..SocialEarnParams::standard()
        };
        let mut e = SocialEarn::new(params);
        e.record_call(1, [1u8; 32], 1);
        e.record_call(2, [1u8; 32], 2);
        e.record_call(3, [2u8; 32], 3);
        e.record_call(4, [3u8; 32], 4);
        e.record_outcome(&[1u8; 32], 1_000);
        e.reconcile();
        assert!(
            e.quality_bps_for(1).is_some(),
            "retained mint's caller earns"
        );
        let build = || {
            let mut g = SocialEarn::new(SocialEarnParams::standard());
            for (s, m, ts, net) in [
                (1u64, [1u8; 32], 100u64, 5_000i128),
                (2, [1u8; 32], 110, 5_000),
                (1, [2u8; 32], 120, -2_000),
            ] {
                g.record_call(s, m, ts);
                g.record_outcome(&m, net);
            }
            g.reconcile();
            (g.quality_bps_for(1), g.quality_bps_for(2))
        };
        assert_eq!(build(), build());
    }
