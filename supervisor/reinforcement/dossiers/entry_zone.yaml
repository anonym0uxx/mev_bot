component: entry_zone
constitution_refs: []
spec: Independence-lock dossier for the `entry_zone` module of pump-quant-evaluator (constitution-gap capability). Each leaf's property_test locks that leaf's public contract, verified against the committed Phase-A implementation. Integer/deterministic (§22).
invariants: []
adversarial_checks: []
leaves:
- leaf_id: classify_entry_zone_taxonomy
  responsibility: Deterministically map (market_cap, phase, thresholds) onto the seven §25 entry zones, with migration phase dominating the cap-band ladder.
  signature: 'pub fn classify_entry_zone(market_cap: u64, phase: MigrationPhase, thresholds: ZoneThresholds) -> EntryZone'
  invariants:
  - 'Migration phase dominates cap: any Migrating input classifies MigrationEdge and any PostMigration input classifies PostMigrationRevival, for every market_cap including 0 and u64::MAX.'
  - 'PreMigration caps follow the half-open [lo,hi) ladder: cap<sub5k->Sub5kPreAttention, [sub5k,early9k)->Band5kTo9kEarlyValidation, [early9k,target20k)->Band9kTo20kTarget, [target20k,momentum50k)->Band20kTo50kMomentumConfirmed.'
  - A PreMigration cap at or above momentum50k classifies PreMigrationLate (never a momentum band), up to u64::MAX.
  - Ill-formed (non-strictly-ascending) thresholds panic with 'strictly ascending' rather than silently misclassifying.
  reference_pattern: property_test is the sole correctness authority; authored and self-verified to compile and pass against the committed implementation.
  property_test: |
    #[test]
    fn gd_classify_entry_zone_taxonomy() {
        let th = ZoneThresholds::standard();
        let p = MigrationPhase::PreMigration;

        // Half-open [lo, hi) cap ladder for pre-migration.
        assert_eq!(classify_entry_zone(0, p, th), EntryZone::Sub5kPreAttention);
        assert_eq!(
            classify_entry_zone(4_999, p, th),
            EntryZone::Sub5kPreAttention
        );
        assert_eq!(
            classify_entry_zone(5_000, p, th),
            EntryZone::Band5kTo9kEarlyValidation
        );
        assert_eq!(
            classify_entry_zone(8_999, p, th),
            EntryZone::Band5kTo9kEarlyValidation
        );
        assert_eq!(
            classify_entry_zone(9_000, p, th),
            EntryZone::Band9kTo20kTarget
        );
        assert_eq!(
            classify_entry_zone(19_999, p, th),
            EntryZone::Band9kTo20kTarget
        );
        assert_eq!(
            classify_entry_zone(20_000, p, th),
            EntryZone::Band20kTo50kMomentumConfirmed
        );
        assert_eq!(
            classify_entry_zone(49_999, p, th),
            EntryZone::Band20kTo50kMomentumConfirmed
        );
        // At/above the top edge, a still-pre-migration token is Late, not a band.
        assert_eq!(
            classify_entry_zone(50_000, p, th),
            EntryZone::PreMigrationLate
        );
        assert_eq!(
            classify_entry_zone(u64::MAX, p, th),
            EntryZone::PreMigrationLate
        );

        // Phase dominates the cap band entirely.
        assert_eq!(
            classify_entry_zone(0, MigrationPhase::Migrating, th),
            EntryZone::MigrationEdge
        );
        assert_eq!(
            classify_entry_zone(u64::MAX, MigrationPhase::Migrating, th),
            EntryZone::MigrationEdge
        );
        assert_eq!(
            classify_entry_zone(0, MigrationPhase::PostMigration, th),
            EntryZone::PostMigrationRevival
        );
        assert_eq!(
            classify_entry_zone(u64::MAX, MigrationPhase::PostMigration, th),
            EntryZone::PostMigrationRevival
        );
    }

    #[test]
    #[should_panic(expected = "strictly ascending")]
    fn gd_classify_entry_zone_rejects_ill_formed() {
        let bad = ZoneThresholds {
            sub5k: 5_000,
            early9k: 5_000, // not strictly ascending
            target20k: 20_000,
            momentum50k: 50_000,
        };
        let _ = classify_entry_zone(1_000, MigrationPhase::PreMigration, bad);
    }
- leaf_id: stratify_by_zone_aggregate
  responsibility: Group reconciled outcome rows by entry zone and emit one deterministic per-zone aggregate (sums, rug rate in bps, MFE/MAE medians) in ascending ordinal order.
  signature: 'pub fn stratify_by_zone(rows: &[ZoneOutcomeRow]) -> Vec<ZoneStrata>'
  invariants:
  - Exactly one ZoneStrata is emitted per zone present in the input, ordered by ascending EntryZone ordinal regardless of input order; zones absent from input are never fabricated.
  - Per-zone net_lamports/fees/impact_lamports equal the exact sums of member rows, n equals the member count, and rug_count equals the count of rugged members.
  - rug_rate_bps == rug_count * 10_000 / n (integer), yielding 0 when no rugs and 10_000 when all members rugged.
  - median_mfe_bps / median_mae_bps are the integer medians of the zone's excursions (even count averages the two central elements via integer division).
  - Empty input yields an empty vector.
  reference_pattern: property_test is the sole correctness authority; authored and self-verified to compile and pass against the committed implementation.
  property_test: |
    #[test]
    fn gd_stratify_by_zone_aggregate() {
        let z = EntryZone::Band9kTo20kTarget;
        let rows = vec![
            // Out-of-ordinal-order input; two Target zone rows and one Sub5k row.
            ZoneOutcomeRow::test(z, 1_000, 100, 10, false, 5_000, -1_000),
            ZoneOutcomeRow::test(z, -400, 50, 5, true, 2_000, -3_000),
            ZoneOutcomeRow::test(
                EntryZone::Sub5kPreAttention,
                9_999,
                1,
                1,
                false,
                8_000,
                -500,
            ),
        ];
        let out = stratify_by_zone(&rows);

        // One strata per present zone, ascending ordinal order.
        assert_eq!(out.len(), 2);
        assert_eq!(out[0].zone, EntryZone::Sub5kPreAttention); // ordinal 0
        assert_eq!(out[1].zone, z); // ordinal 2

        // Sub5k singleton.
        let sub = out[0];
        assert_eq!(sub.n, 1);
        assert_eq!(sub.net_lamports, 9_999);
        assert_eq!(sub.rug_count, 0);
        assert_eq!(sub.rug_rate_bps, 0);
        assert_eq!(sub.median_mfe_bps, 8_000);
        assert_eq!(sub.median_mae_bps, -500);

        // Target aggregate: checked sums, rug rate in bps, integer-avg medians.
        let t = out[1];
        assert_eq!(t.n, 2);
        assert_eq!(t.net_lamports, 600);
        assert_eq!(t.fees, 150);
        assert_eq!(t.impact_lamports, 15);
        assert_eq!(t.rug_count, 1);
        assert_eq!(t.rug_rate_bps, 5_000); // 1 * 10_000 / 2
        assert_eq!(t.median_mfe_bps, 3_500); // (2_000 + 5_000) / 2
        assert_eq!(t.median_mae_bps, -2_000); // (-3_000 + -1_000) / 2
    }

    #[test]
    fn gd_stratify_by_zone_empty_and_all_rugged() {
        // Empty input -> empty output (no fabricated zero rows).
        assert!(stratify_by_zone(&[]).is_empty());

        // Every outcome rugged -> full 10_000 bps rug rate.
        let z = EntryZone::MigrationEdge;
        let rows = vec![
            ZoneOutcomeRow::test(z, -1_000, 10, 0, true, 100, -9_000),
            ZoneOutcomeRow::test(z, -2_000, 10, 0, true, 50, -9_500),
        ];
        let out = stratify_by_zone(&rows);
        assert_eq!(out.len(), 1);
        assert_eq!(out[0].n, 2);
        assert_eq!(out[0].rug_count, 2);
        assert_eq!(out[0].rug_rate_bps, 10_000);
        assert_eq!(out[0].net_lamports, -3_000);
        assert_eq!(out[0].median_mae_bps, -9_250); // (-9_500 + -9_000) / 2
    }
- leaf_id: zone_ordinal_ordering
  responsibility: Guarantee EntryZone::ordinal is the dense 0..7 sequence in declaration order and agrees with derived Ord, the deterministic key stratification output order relies on.
  signature: pub fn ordinal(self) -> u8
  invariants:
  - ordinal() returns the dense sequence 0,1,2,3,4,5,6 for the seven zones in declaration order (no gaps, no duplicates).
  - ordinal() is strictly monotone across the declared zone order and agrees with the enum's derived Ord (a<b iff a.ordinal()<b.ordinal()).
  - ZoneThresholds::standard() is well-formed (is_well_formed()==true).
  - A ladder with any non-strictly-ascending pair (e.g. equal target20k) reports is_well_formed()==false.
  reference_pattern: property_test is the sole correctness authority; authored and self-verified to compile and pass against the committed implementation.
  property_test: |
    #[test]
    fn gd_zone_ordinal_dense_and_monotone() {
        let zones = [
            EntryZone::Sub5kPreAttention,
            EntryZone::Band5kTo9kEarlyValidation,
            EntryZone::Band9kTo20kTarget,
            EntryZone::Band20kTo50kMomentumConfirmed,
            EntryZone::PreMigrationLate,
            EntryZone::MigrationEdge,
            EntryZone::PostMigrationRevival,
        ];

        // Ordinals are the dense sequence 0..7 in declaration order.
        for (i, z) in zones.iter().enumerate() {
            assert_eq!(z.ordinal(), i as u8);
        }

        // Ordinal order matches the enum's derived Ord (deterministic output order).
        for w in zones.windows(2) {
            assert!(w[0].ordinal() < w[1].ordinal());
            assert!(w[0] < w[1]);
        }

        // Well-formedness of the standard ladder is what the classifier relies on.
        assert!(ZoneThresholds::standard().is_well_formed());
        let bad = ZoneThresholds {
            sub5k: 5_000,
            early9k: 9_000,
            target20k: 9_000, // equal -> not strictly ascending
            momentum50k: 50_000,
        };
        assert!(!bad.is_well_formed());
    }
