component: economic_gate
constitution_refs: ["§34.4", "§49", "criteria 77, 112", "defect #6"]
spec: >
  The MinimumEconomicTradeGate arithmetic core: the U-shaped round-trip cost model and the
  size-viability band it produces. Round-trip cost as a fraction of position is
  fixed/x + protocol + impact(x), where fixed is size-invariant (priority + tip + gas)
  INFLATED by the failure-rate attempt multiplier 1/(1-p_fail) because failed transactions
  pay fixed cost and land nothing, protocol is a size-invariant rate, and impact(x) rises
  with size per the decoded curve/reserve model. The gate derives, per candidate and per
  decoded market state: a minimum viable size x_min (refuse below — never shrink into a
  guaranteed loss), a cost-minimizing reference x_cost, and a maximum viable size x_max
  (impact + sellability bound). These are INPUTS to Section 49 sizing and are explicitly
  distinct from the far-larger unconstrained profit-maximizing size. All integer fixed-point
  (lamports, bps); no floats in outcome-controlling logic. This is the arithmetic that makes
  the legacy 0.01-SOL structural loss impossible by construction.
invariants:
  - "no f32/f64 in any outcome-controlling path; lamports u64/u128, ratios in bps"
  - "identical inputs produce identical band (determinism)"
  - "x_min is the smallest size whose expected executable move still clears the full floor with configured margin; a risk-permitted size below x_min yields REFUSE, never a shrunk position"
  - "fixed cost is always multiplied by the attempt multiplier before use; a zero failure rate leaves it unchanged, a positive rate strictly raises x_min"
  - "x_min <= x_cost <= x_max whenever the band is non-empty; an empty band (x_min > x_max) yields REFUSE"
adversarial_checks:
  - "at a size where fixed/x alone exceeds the edge, admit() returns Refuse regardless of how attractive the gross edge is"
  - "raising the failure rate strictly raises x_min (fixed-cost surcharge is monotone)"
  - "raising priority fee or tip raises both x_min and x_cost (band shifts up with fixed cost)"
  - "the profit-maximizing size R*(edge-protocol)/4 is NOT returned as the trade size — the band is a constraint, not the sizer"
benchmark:
  bench_name: economic_gate_bench
  budgets_ns:
    p50_ns: 200.0
    p99_ns: 800.0

leaves:
  - leaf_id: eg_effective_fixed
    responsibility: "inflate size-invariant fixed cost by the failure-rate attempt multiplier"
    signature: >
      pub fn effective_fixed_lamports(base_fixed_lamports: u64, fail_rate_bps: u32) -> Option<u64>
    invariants:
      - "returns base_fixed when fail_rate_bps == 0 (multiplier 1.0)"
      - "multiplier is 1/(1 - p) with p = fail_rate_bps/10_000; strictly increasing in p"
      - "fail_rate_bps >= 10_000 (certain failure) returns None — no finite attempt count"
      - "integer math: effective = base * 10_000 / (10_000 - fail_rate_bps), checked"
    reference_pattern: |
      // if fail_rate_bps >= 10_000 { return None; }
      // let denom = (10_000 - fail_rate_bps) as u128;
      // Some(((base_fixed_lamports as u128 * 10_000u128) / denom) as u64)
    property_test: |
      #[test]
      fn prop_effective_fixed_multiplier() {
          assert_eq!(effective_fixed_lamports(100, 0), Some(100));
          // 26.8% failure -> multiplier ~1.366 -> ~136
          let e = effective_fixed_lamports(100, 2680).unwrap();
          assert!(e >= 136 && e <= 137);
          // monotone: higher failure rate -> higher effective fixed
          assert!(effective_fixed_lamports(100, 5000).unwrap()
                  > effective_fixed_lamports(100, 2680).unwrap());
          assert_eq!(effective_fixed_lamports(100, 10_000), None);
      }
    max_lines: 15
    temperature_band: low

  - leaf_id: eg_cost_pct
    responsibility: "total round-trip cost in bps at a given size: fixed/x + protocol + impact(x)"
    signature: >
      pub fn round_trip_cost_bps(size_lamports: u64, eff_fixed_lamports: u64,
      protocol_bps: u32, impact: &ImpactCurve) -> Option<u32>
    invariants:
      - "fixed component in bps = eff_fixed * 10_000 / size; falls as size rises"
      - "protocol component is size-invariant; impact component rises with size per the curve"
      - "returns None on size == 0 (division guard)"
      - "total is the exact integer sum of the three bps components"
    reference_pattern: |
      // if size_lamports == 0 { return None; }
      // let fixed_bps = (eff_fixed_lamports as u128 * 10_000u128
      //                  / size_lamports as u128) as u32;
      // Some(fixed_bps + protocol_bps + impact.impact_bps(size_lamports))
    property_test: |
      #[test]
      fn prop_cost_is_u_shaped() {
          let c = ImpactCurve::linear_test(1_000);
          let small = round_trip_cost_bps(10_000, 160, 200, &c).unwrap();
          let mid   = round_trip_cost_bps(50_000, 160, 200, &c).unwrap();
          let large = round_trip_cost_bps(500_000, 160, 200, &c).unwrap();
          assert!(mid < small, "cost falls from tiny size (fixed cost amortizes)");
          assert!(large > mid, "cost rises at large size (impact dominates)");
          assert_eq!(round_trip_cost_bps(0, 160, 200, &c), None);
      }
    depends_on: ["eg_effective_fixed"]
    max_lines: 20
    temperature_band: low

  - leaf_id: eg_min_viable_size
    responsibility: "smallest size whose expected move clears the full cost floor with margin (x_min)"
    signature: >
      pub fn min_viable_size(expected_move_bps: u32, eff_fixed_lamports: u64,
      protocol_bps: u32, margin_bps: u32, impact: &ImpactCurve,
      search_hi_lamports: u64) -> Option<u64>
    invariants:
      - "returns the smallest size where expected_move_bps >= cost_bps(size) + margin_bps"
      - "returns None when no size up to search_hi satisfies it (candidate inadmissible at any size)"
      - "monotone search valid because cost is U-shaped: below x_cost cost falls with size, so x_min is the lower crossing"
      - "pure integer; deterministic bisection or bounded scan"
    reference_pattern: |
      // The lower feasibility crossing sits on the FALLING (fixed-cost-dominated) branch,
      // where cost decreases as size rises, so scan upward for the first size that clears:
      //   need: expected_move_bps >= round_trip_cost_bps(size) + margin_bps
      // bounded geometric scan from a small seed to search_hi; first satisfying size is x_min.
      // If even x_cost (bottom of the curve) doesn't clear, the candidate is inadmissible -> None.
    property_test: |
      #[test]
      fn prop_min_viable_refuses_when_fixed_dominates() {
          let c = ImpactCurve::linear_test(1_000);
          // generous move: 400 bps expected, fixed 160 lamports, protocol 200, margin 50
          let x = min_viable_size(400, 160, 200, 50, &c, 10_000_000).unwrap();
          // at x, cost+margin must be covered; just below x it must NOT be
          let cost_at = round_trip_cost_bps(x, 160, 200, &c).unwrap();
          assert!(400 >= cost_at + 50);
          // a move smaller than protocol+margin can never clear at any size -> None
          assert_eq!(min_viable_size(210, 160, 200, 50, &c, 10_000_000), None);
      }
    depends_on: ["eg_cost_pct"]
    max_lines: 35
    temperature_band: high

  - leaf_id: eg_size_band
    responsibility: "assemble the full viability band [x_min, x_cost, x_max] and the admit/refuse verdict"
    signature: >
      pub fn size_band(expected_move_bps: u32, base_fixed_lamports: u64, fail_rate_bps: u32,
      protocol_bps: u32, margin_bps: u32, depth_lamports: u64, impact: &ImpactCurve,
      sellable_max_lamports: u64) -> SizeBand
      // SizeBand { verdict: Admit|Refuse, x_min: u64, x_cost: u64, x_max: u64 }
    invariants:
      - "x_cost ~= isqrt(eff_fixed * depth / 2) (bottom of the U); reported as context, never used as the trade size"
      - "x_max = min(impact-bounded size at margin, sellable_max_lamports)"
      - "verdict is Admit iff x_min exists and x_min <= x_max; otherwise Refuse"
      - "the profit-maximizing size R*(move-protocol)/4 is deliberately NOT computed here — sizing is Section 49's job; this leaf only bounds it"
    reference_pattern: |
      // let eff = effective_fixed_lamports(base_fixed_lamports, fail_rate_bps)?;   // Refuse on None
      // let x_cost = isqrt((eff as u128 * depth_lamports as u128 / 2) as u128) as u64;
      // let x_min = match min_viable_size(move, eff, protocol, margin, impact, x_max_guess) {
      //     Some(v) => v, None => return SizeBand::refuse() };
      // let x_impact = impact.max_size_at(/* impact budget from margin */);
      // let x_max = x_impact.min(sellable_max_lamports);
      // if x_min > x_max { SizeBand::refuse() } else { SizeBand::admit(x_min, x_cost, x_max) }
    property_test: |
      #[test]
      fn prop_band_ordering_and_refusal() {
          let c = ImpactCurve::linear_test(1_000);
          let b = size_band(400, 160, 2680, 200, 50, 85_000_000, &c, 50_000_000);
          if matches!(b.verdict, Verdict::Admit) {
              assert!(b.x_min <= b.x_cost && b.x_cost <= b.x_max);
          }
          // impossibly thin edge -> Refuse, empty band
          let r = size_band(205, 160, 2680, 200, 50, 85_000_000, &c, 50_000_000);
          assert!(matches!(r.verdict, Verdict::Refuse));
          // profit-max sanity: for a 400bps move on depth 85e6, R*(move-proto)/4 is huge;
          // x_cost must be far below it (band is a constraint, not the maximizer)
          let admit = size_band(400, 160, 0, 200, 50, 85_000_000, &c, 50_000_000);
          if matches!(admit.verdict, Verdict::Admit) {
              let profit_max = 85_000_000u64 * (400 - 200) as u64 / 4 / 10_000;
              assert!(admit.x_cost < profit_max);
          }
      }
    depends_on: ["eg_min_viable_size", "eg_effective_fixed"]
    max_lines: 45
    temperature_band: high
