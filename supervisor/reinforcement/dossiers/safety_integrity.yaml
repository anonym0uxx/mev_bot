component: safety_integrity
constitution_refs: ["criteria 7, 8, 15, 45, 52, 59, 64, 65, 66, 67, 68, 77, 78, 86, 87, 88, 94, 101, 105"]
spec: >
  The safety-boundary and data-integrity core: the pure, laptop-buildable functions that enforce
  the constitution's hardest guarantees by construction. This dossier exists because the initial
  component dossiers covered the mechanical trading core (reducer, exits, sizing, evaluator) but
  omitted an entire class of criteria that are equally load-bearing and equally pure: the ones
  that keep bad data, model output, un-simulated orders, and copy-trading OUT of the live path,
  and that keep cost math honest across quote mints. Several of these criteria are stated in the
  constitution as "proven by test" — meaning they demand a testable function, not prose. Each leaf
  below is a single deterministic function with a property test; none require hardware, live
  endpoints, or the server. What they collectively guarantee: the only path to an order runs
  through the full deterministic pipeline (criterion 88), model output can never become fact
  (8, 45), missing/failed states are represented rather than fabricated (7, 15, 64), sizing takes
  authenticity exactly once (101), fee/cost math is quote-mint parametric (94), every order proves
  sellability (77), failures are classified not silently retried (78), and smart-money observation
  can only reweight, never copy (86, 87). This is the "impossible by construction" layer.
invariants:
  - "no f32/f64 in any outcome-controlling path; lamports u64/u128, ratios in bps"
  - "identical inputs produce identical outputs (determinism) for every function here"
  - "every function is total: it returns a typed refusal/UNKNOWN rather than panicking on bad input"
adversarial_checks:
  - "a decision assembled from any wallet/social/chart/label observation that skips the deterministic pipeline is rejected at the type level (criterion 88)"
  - "an attempt to place model-derived text into factual state fails to compile or is rejected at runtime (criterion 8)"
  - "authenticity confidence applied twice (both through edge and as a haircut) is detected and rejected (criterion 101)"
  - "a SOL-quote cost assumption applied to a USDC-quote market is caught (criterion 94)"

leaves:
  - leaf_id: si_missingness
    responsibility: "map an optional/partial field to an explicit UNKNOWN / INCOMPLETE / REJECT state; missing data never silently becomes zero or a default"
    signature: >
      pub fn resolve_field(raw: Option<FieldEvidence>, required: bool) -> FieldState
    invariants:
      - "None with required=true yields FieldState::Reject; None with required=false yields FieldState::Unknown"
      - "a present-but-unparseable value yields FieldState::Incomplete, never a defaulted number"
      - "a fully resolved value yields FieldState::Known(v) carrying its source evidence id"
      - "the function is total and deterministic"
    reference_pattern: "enum FieldState { Known(Evidence), Unknown, Incomplete, Reject } — match on raw, never unwrap_or(0)"
    property_test: |
      #[test]
      fn required_missing_rejects() {
          assert_eq!(resolve_field(None, true), FieldState::Reject);
      }
      #[test]
      fn optional_missing_unknown() {
          assert_eq!(resolve_field(None, false), FieldState::Unknown);
      }
      #[test]
      fn unparseable_incomplete() {
          let fe = FieldEvidence {
              evidence_id: 7,
              parsed: None,
          };
          assert_eq!(resolve_field(Some(fe), true), FieldState::Incomplete);
          let fe = FieldEvidence {
              evidence_id: 7,
              parsed: None,
          };
          assert_eq!(resolve_field(Some(fe), false), FieldState::Incomplete);
      }
      #[test]
      fn resolved_known_carries_evidence() {
          let fe = FieldEvidence {
              evidence_id: 42,
              parsed: Some(-5),
          };
          match resolve_field(Some(fe), true) {
              FieldState::Known(e) => {
                  assert_eq!(e.evidence_id, 42);
                  assert_eq!(e.value, -5);
              }
              other => panic!("expected Known, got {:?}", other),
          }
      }
    max_lines: 30

  - leaf_id: si_no_llm_fact
    responsibility: "type-enforced boundary: a value tagged as model-produced cannot be admitted into factual state; only chain-evidence-tagged values pass"
    signature: >
      pub fn admit_fact(v: TaggedValue) -> Result<FactValue, FactError>
    invariants:
      - "TaggedValue::Model(_) always returns Err(FactError::ModelOutputRejected)"
      - "TaggedValue::ResearchArtifact(_) always returns Err (research cannot be fact)"
      - "only TaggedValue::ChainEvidence(_) returns Ok(FactValue)"
      - "no code path converts Model/ResearchArtifact into ChainEvidence"
    reference_pattern: "enum TaggedValue { ChainEvidence(E), Model(M), ResearchArtifact(R) } — the provenance is in the type"
    property_test: |
      #[test]
      fn model_and_research_rejected_chain_admitted() {
          let m = TaggedValue::Model(ModelOutput {
              text: "buy now".into(),
          });
          assert_eq!(admit_fact(m), Err(FactError::ModelOutputRejected));

          let r = TaggedValue::ResearchArtifact(ResearchArtifact {
              note: "narrative".into(),
              provenance: CaptureProvenance::Social,
              horizon: HorizonClass::Short,
          });
          assert_eq!(admit_fact(r), Err(FactError::ResearchRejected));

          let c = TaggedValue::ChainEvidence(ChainEvidence {
              slot: 100,
              value: 9,
          });
          assert_eq!(
              admit_fact(c),
              Ok(FactValue {
                  slot: 100,
                  value: 9
              })
          );
      }
    max_lines: 25

  - leaf_id: si_failed_sell_state
    responsibility: "encode failed sells and terminal loss as first-class outcomes in the trade record, distinct from a completed round trip"
    signature: >
      pub fn classify_terminal(outcome: &RawOutcome) -> TerminalState
    invariants:
      - "a sell that never landed yields TerminalState::FailedSell (not a zero-PnL close)"
      - "a position with no exit and an inactivity timeout yields TerminalState::TerminalLoss"
      - "a completed round trip yields TerminalState::Closed{net_lamports}"
      - "net accounting for FailedSell/TerminalLoss reflects full loss including fixed cost paid"
    reference_pattern: "enum TerminalState { Closed{net_lamports:i128}, FailedSell, TerminalLoss } — losses are representable"
    property_test: |
      #[test]
      fn failed_sell_distinct_from_zero_close() {
          let o = RawOutcome {
              entry_lamports: 1000,
              exit_lamports: None,
              fixed_cost_lamports: 50,
              sell_landed: false,
              inactivity_timeout: false,
          };
          let t = classify_terminal(&o);
          assert_eq!(t, TerminalState::FailedSell);
          assert_ne!(t, TerminalState::Closed { net_lamports: 0 });
          // full loss includes fixed cost
          assert_eq!(t.net_lamports(&o), -(1000 + 50));
      }
      #[test]
      fn terminal_loss_distinct_and_full_loss() {
          let o = RawOutcome {
              entry_lamports: 2000,
              exit_lamports: None,
              fixed_cost_lamports: 30,
              sell_landed: false,
              inactivity_timeout: true,
          };
          let t = classify_terminal(&o);
          assert_eq!(t, TerminalState::TerminalLoss);
          assert_ne!(t, TerminalState::Closed { net_lamports: 0 });
          assert_eq!(t.net_lamports(&o), -(2000 + 30));
      }
      #[test]
      fn completed_round_trip_closed() {
          let o = RawOutcome {
              entry_lamports: 1000,
              exit_lamports: Some(1200),
              fixed_cost_lamports: 50,
              sell_landed: true,
              inactivity_timeout: false,
          };
          assert_eq!(
              classify_terminal(&o),
              TerminalState::Closed { net_lamports: 150 }
          );
      }
    max_lines: 30

  - leaf_id: si_narrative_boundary
    responsibility: "keep narrative/social capture separate from chain truth: a narrative record can never be read as a factual reducer input without passing admission"
    signature: >
      pub fn narrative_to_research(n: NarrativeRecord) -> ResearchArtifact
    invariants:
      - "the output type is ResearchArtifact and there is NO function converting it to a FactValue"
      - "a NarrativeRecord carries its capture provenance and horizon class"
      - "no narrative reducer is constructible without an admitted-evidence token"
    reference_pattern: "narrative always lands in ResearchArtifact; admission is a separate gated step (criterion 83)"
    property_test: |
      #[test]
      fn narrative_lands_in_research() {
          let n = NarrativeRecord {
              text: "hype".into(),
              provenance: CaptureProvenance::Chart,
              horizon: HorizonClass::Immediate,
          };
          let r: ResearchArtifact = narrative_to_research(n);
          assert_eq!(r.provenance, CaptureProvenance::Chart);
          assert_eq!(r.horizon, HorizonClass::Immediate);
          // The only admission path rejects research → no direct narrative->fact route.
          let tagged = TaggedValue::ResearchArtifact(r);
          assert_eq!(admit_fact(tagged), Err(FactError::ResearchRejected));
      }
