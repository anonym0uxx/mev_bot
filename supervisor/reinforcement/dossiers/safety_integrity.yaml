  - leaf_id: si_config_boot_guard
    responsibility: "reject boot from contradictory or live-armed committed configs; only a validated, non-contradictory, non-live-armed config boots"
    signature: >
      pub fn validate_boot_config(cfg: &BootConfig) -> Result<ValidatedConfig, BootError>
    invariants:
      - "a config with live_armed=true committed to source yields Err(BootError::LiveArmedCommitted)"
      - "mutually contradictory fields (e.g. shadow=true and live=true) yield Err(BootError::Contradictory)"
      - "only a fully consistent, non-live-armed config yields Ok(ValidatedConfig)"
      - "the function is pure over the config value"
    reference_pattern: "validate-then-construct: ValidatedConfig has no public constructor except through this fn"
    property_test: |
      #[test]
      fn live_armed_committed_rejected() {
          let cfg = BootConfig {
              live_armed: true,
              committed_to_source: true,
              shadow: false,
              live: false,
          };
          assert_eq!(
              validate_boot_config(&cfg),
              Err(BootError::LiveArmedCommitted)
          );
      }
      #[test]
      fn contradictory_rejected() {
          let cfg = BootConfig {
              live_armed: false,
              committed_to_source: true,
              shadow: true,
              live: true,
          };
          assert_eq!(validate_boot_config(&cfg), Err(BootError::Contradictory));
      }
      #[test]
      fn clean_config_accepted() {
          let cfg = BootConfig {
              live_armed: false,
              committed_to_source: true,
              shadow: true,
              live: false,
          };
          let v = validate_boot_config(&cfg).expect("clean config should validate");
          assert!(v.shadow());
          assert!(!v.live());
      }
    max_lines: 30

  - leaf_id: si_signing_boundary
    responsibility: "the signing boundary type: trading keys are non-exportable to the agent; every signing request carries a policy decision and no API returns raw key bytes"
    signature: >
      pub fn sign_through_policy(req: &SignRequest, policy: &SignPolicy) -> Result<SignedTx, SignError>
    invariants:
      - "there is no public function that returns the raw private key bytes (non-exportable by construction)"
      - "a SignRequest violating policy (unapproved program, over-cap size) yields Err(SignError::PolicyDenied)"
      - "a permitted request yields Ok(SignedTx) without exposing key material"
      - "the KeyHandle type does not implement Debug/Display/Serialize (cannot be printed or exported)"
    reference_pattern: "opaque KeyHandle behind a trait; sign() borrows it, never returns it; policy checked before signing"
    property_test: |
      #[test]
      fn unapproved_and_over_cap_denied() {
          let policy = SignPolicy {
              approved_programs: vec![10, 20],
              max_tx_size: 1000,
              key: KeyHandle::new(1),
          };
          let unapproved = SignRequest {
              program_id: 99,
              tx_size: 100,
              digest: 5,
          };
          assert_eq!(
              sign_through_policy(&unapproved, &policy),
              Err(SignError::PolicyDenied)
          );
          let overcap = SignRequest {
              program_id: 10,
              tx_size: 5000,
              digest: 5,
          };
          assert_eq!(
              sign_through_policy(&overcap, &policy),
              Err(SignError::PolicyDenied)
          );
      }
      #[test]
      fn permitted_signs_deterministically() {
          let policy = SignPolicy {
              approved_programs: vec![10],
              max_tx_size: 1000,
              key: KeyHandle::new(1),
          };
          let req = SignRequest {
              program_id: 10,
              tx_size: 100,
              digest: 5,
          };
          let a = sign_through_policy(&req, &policy).expect("should sign");
          let b = sign_through_policy(&req, &policy).expect("should sign");
          assert_eq!(a, b); // deterministic, no key material exposed
      }
    max_lines: 35

  - leaf_id: si_disconnect_safe
    responsibility: "a stream disconnect (LaserStream/shred) produces an explicit gap/stale marker, never fabricated or interpolated state"
    signature: >
      pub fn on_disconnect(stream: &mut StreamState, at_seq: u64) -> GapMarker
    invariants:
      - "a disconnect records a GapMarker{from_seq, to_seq: None} — the gap is explicit"
      - "no state is synthesized to fill the gap (subsequent reads see Unknown across the gap)"
      - "reconnection with a new epoch is recorded as a distinct epoch boundary, not a continuation"
      - "the function is deterministic given the stream state"
    reference_pattern: "disconnect -> open GapMarker; the reducer treats gapped spans as Unknown, not zero"
    property_test: |
      #[test]
      fn disconnect_opens_explicit_gap_no_interpolation() {
          let mut s = StreamState::new();
          let m = on_disconnect(&mut s, 500);
          assert_eq!(m.from_seq, 500);
          assert_eq!(m.to_seq, None);
          assert!(!s.connected);
          assert_eq!(s.gaps.len(), 1);
          // gapped seqs read as Unknown (no synthesized events)
          assert!(s.is_gapped(600));
      }
      #[test]
      fn reconnect_is_distinct_epoch_boundary() {
          let mut s = StreamState::new();
          on_disconnect(&mut s, 500);
          let e0 = s.epoch;
          s.reconnect(800);
          assert_eq!(s.epoch, e0 + 1);
          assert_eq!(s.gaps[0].to_seq, Some(800));
          assert!(!s.is_gapped(900));
      }
    max_lines: 30

  - leaf_id: si_replay_provenance
    responsibility: "tag every observation as ORIGINAL_LIVE vs PROVIDER_REPLAY so replayed data is never counted as original live discovery in any metric"
    signature: >
      pub fn tag_provenance(obs: &Observation, source_mode: SourceMode) -> ProvenancedObs
    invariants:
      - "SourceMode::Replay yields Provenance::ProviderReplay on the observation"
      - "SourceMode::Live yields Provenance::OriginalLive"
      - "a metric aggregator can filter by provenance; replay and live never merge silently"
      - "provenance is immutable once set"
    reference_pattern: "provenance is a required field set at ingestion; no default; metrics group by it"
    property_test: |
      #[test]
      fn mode_maps_to_provenance_and_is_immutable() {
          let obs = Observation { seq: 1, payload: 7 };
          let live = tag_provenance(&obs, SourceMode::Live);
          assert_eq!(live.provenance(), Provenance::OriginalLive);
          let replay = tag_provenance(&obs, SourceMode::Replay);
          assert_eq!(replay.provenance(), Provenance::ProviderReplay);
          // immutable: still original after re-reading
          assert_eq!(live.provenance(), Provenance::OriginalLive);
          assert_ne!(live.provenance(), replay.provenance());
      }
    max_lines: 25

  - leaf_id: si_source_contract
    responsibility: "the neutral ObservationSource contract: a successor source can be added and the Jito adapter removed without touching StrategyRuntime (criteria 66, 67, 68 — proven by test)"
    signature: >
      pub trait ObservationSource { fn poll(&mut self) -> Option<Observation>; fn source_id(&self) -> SourceId; }
    invariants:
      - "StrategyRuntime depends only on the ObservationSource trait, never on a concrete adapter type"
      - "a NullSource and a second FakeSource both satisfy the trait and drive the runtime unchanged (successor added)"
      - "removing the Jito adapter leaves the runtime compiling (no Jito-specific type leaks past the trait)"
      - "no downstream component matches on the concrete source type"
    reference_pattern: "runtime holds Box<dyn ObservationSource>; adapters are swappable; test constructs two different sources"
    property_test: |
      #[test]
      fn two_distinct_sources_drive_runtime() {
          let null = NullSource { id: 1 };
          let mut rt_null = StrategyRuntime::new(Box::new(null));
          assert_eq!(rt_null.drive_to_empty(), 0);
          assert_eq!(rt_null.source_id(), SourceId(1));

          let fake = FakeSource::new(
              2,
              vec![
                  Observation {
                      seq: 1,
                      payload: 10,
                  },
                  Observation {
                      seq: 2,
                      payload: 20,
                  },
                  Observation {
                      seq: 3,
                      payload: 30,
                  },
              ],
          );
          let mut rt_fake = StrategyRuntime::new(Box::new(fake));
          assert_eq!(rt_fake.drive_to_empty(), 3);
          assert_eq!(rt_fake.source_id(), SourceId(2));
      }
    max_lines: 40

  - leaf_id: si_sell_simulation
    responsibility: "post-entry sell-simulation proof: every live position must produce a proof that a sell instruction constructs and simulates successfully against current decoded state (criterion 77)"
    signature: >
      pub fn prove_sellable(pos: &Position, state: &DecodedMarket) -> Result<SellProof, SellUnprovable>
    invariants:
      - "a market state where the sell instruction fails to construct yields Err(SellUnprovable)"
      - "insufficient reserve/liquidity for the position size yields Err(SellUnprovable)"
      - "a constructible, simulatable sell yields Ok(SellProof) carrying the simulated out-amount"
      - "no position is admitted live without an Ok(SellProof) (enforced by the caller's type)"
    reference_pattern: "construct sell -> simulate against decoded reserves -> proof or explicit unprovable; never assume sellable"
    property_test: |
      #[test]
      fn empty_reserves_unprovable() {
          let pos = Position {
              token_amount: 100,
              mint: 1,
          };
          let empty = DecodedMarket {
              base_reserve: 0,
              quote_reserve: 0,
              constructible: true,
          };
          assert_eq!(
              prove_sellable(&pos, &empty),
              Err(SellUnprovable::InsufficientLiquidity)
          );
      }
      #[test]
      fn unconstructible_unprovable() {
          let pos = Position {
              token_amount: 100,
              mint: 1,
          };
          let mkt = DecodedMarket {
              base_reserve: 1_000_000,
              quote_reserve: 1_000_000,
              constructible: false,
          };
          assert_eq!(
              prove_sellable(&pos, &mkt),
              Err(SellUnprovable::Unconstructible)
          );
      }
      #[test]
      fn simulatable_sell_carries_out_amount() {
          let pos = Position {
              token_amount: 1_000,
              mint: 1,
          };
          let mkt = DecodedMarket {
              base_reserve: 1_000_000,
              quote_reserve: 1_000_000,
              constructible: true,
          };
          let proof = prove_sellable(&pos, &mkt).expect("should be provable");
          // out = 1_000_000 * 1000 / (1_000_000 + 1000) = 999
          assert_eq!(proof.out_amount, 999);
      }
    max_lines: 40

  - leaf_id: si_failure_taxonomy
    responsibility: "classify a decoded transaction program error into the failure taxonomy; construction-class failures flag builder quarantine and can never be silently retried with capital (criterion 78)"
    signature: >
      pub fn classify_failure(err: &DecodedProgramError) -> FailureClass
    invariants:
      - "a slippage/price-moved error yields FailureClass::Transient (retryable within policy)"
      - "a malformed-instruction/account-mismatch error yields FailureClass::Construction (triggers quarantine)"
      - "FailureClass::Construction is never marked retryable-with-capital"
      - "an unknown error decodes to FailureClass::Unknown (conservative: not auto-retried)"
    reference_pattern: "match decoded error -> taxonomy; Construction => quarantine flag, never silent capital retry"
    property_test: |
      #[test]
      fn construction_never_retryable_with_capital() {
          let c = classify_failure(&DecodedProgramError::MalformedInstruction);
          assert_eq!(c, FailureClass::Construction);
          assert!(!c.retryable_with_capital());
          assert!(c.triggers_quarantine());
          let c2 = classify_failure(&DecodedProgramError::AccountMismatch);
          assert_eq!(c2, FailureClass::Construction);
          assert!(!c2.retryable_with_capital());
      }
      #[test]
      fn transient_retryable() {
          let t = classify_failure(&DecodedProgramError::SlippageExceeded);
          assert_eq!(t, FailureClass::Transient);
          assert!(t.retryable_with_capital());
          assert_eq!(
              classify_failure(&DecodedProgramError::PriceMoved),
              FailureClass::Transient
          );
      }
      #[test]
      fn unknown_conservative() {
          let u = classify_failure(&DecodedProgramError::Unknown(7));
          assert_eq!(u, FailureClass::Unknown);
          assert!(!u.retryable_with_capital());
          assert!(!u.triggers_quarantine());
      }
    max_lines: 35

  - leaf_id: si_no_copy_trade
    responsibility: "THE copy-trade impossibility guard (criterion 88, proven by test): no path from any wallet/social/chart/ranking/label observation reaches an order without passing the full deterministic feature+liquidity+risk+economic+sellability+signing pipeline"
    signature: >
      pub fn to_order(signal: ExternalSignal, pipeline: &DeterministicPipeline) -> Result<Order, Blocked>
    invariants:
      - "an ExternalSignal (wallet/social/chart/label) cannot construct an Order except by returning a PipelineTicket first"
      - "the pipeline must pass feature, liquidity, risk, economic (size-band), sellability, and signing stages in order"
      - "skipping any stage yields Err(Blocked{stage}); there is no bypass constructor for Order"
      - "mirroring a specific wallet's trade is unrepresentable: Order carries no source-wallet field to mirror"
    reference_pattern: "Order has no public constructor except pipeline.finish(ticket); ExternalSignal only yields a ticket"
    property_test: |
      fn full_pipe() -> DeterministicPipeline {
          DeterministicPipeline {
              feature_ok: true,
              liquidity_ok: true,
              risk_ok: true,
              economic_ok: true,
              sellability_ok: true,
              signing_ok: true,
          }
      }
      fn sig() -> ExternalSignal {
          ExternalSignal {
              kind: SignalKind::Wallet,
              token_mint: 77,
          }
      }

      #[test]
      fn every_skipped_stage_blocks() {
          let cases = [
              (
                  Stage::Feature,
                  DeterministicPipeline {
                      feature_ok: false,
                      ..full_pipe()
                  },
              ),
              (
                  Stage::Liquidity,
                  DeterministicPipeline {
                      liquidity_ok: false,
                      ..full_pipe()
                  },
              ),
              (
                  Stage::Risk,
                  DeterministicPipeline {
                      risk_ok: false,
                      ..full_pipe()
                  },
              ),
              (
                  Stage::Economic,
                  DeterministicPipeline {
                      economic_ok: false,
                      ..full_pipe()
                  },
              ),
              (
                  Stage::Sellability,
                  DeterministicPipeline {
                      sellability_ok: false,
                      ..full_pipe()
                  },
              ),
              (
                  Stage::Signing,
                  DeterministicPipeline {
                      signing_ok: false,
                      ..full_pipe()
                  },
              ),
          ];
          for (stage, p) in cases {
              assert_eq!(to_order(sig(), &p), Err(Blocked { stage }));
          }
      }
      #[test]
      fn full_pipeline_yields_order_no_mirror_source() {
          let o = to_order(sig(), &full_pipe()).expect("should produce order");
          assert_eq!(o.token_mint(), 77);
          // Order exposes only its token — no source-wallet accessor exists to mirror.
      }
    max_lines: 40

  - leaf_id: si_smart_money_gate
    responsibility: "smart-money classification requires realized external-counterparty PnL that is family-screened and luck-filtered; raw PnL and public-legible wallets cannot qualify (criterion 86)"
    signature: >
      pub fn classify_wallet(w: &WalletEvidence) -> SmartMoneyClass
    invariants:
      - "raw unrealized or self-dealing PnL yields SmartMoneyClass::Unqualified"
      - "a publicly legible wallet carries PUBLIC_BURNED until re-proven (yields Unqualified by default)"
      - "only realized, family-screened, luck-filtered external-counterparty PnL with positive lagged shadow yields Qualified"
      - "the function is deterministic over the evidence"
    reference_pattern: "gate chain: realized? external-counterparty? family-screened? luck-filtered? lagged-shadow-positive? else Unqualified"
    property_test: |
      fn full() -> WalletEvidence {
          WalletEvidence {
              realized: true,
              self_dealing: false,
              external_counterparty: true,
              family_screened: true,
              luck_filtered: true,
              lagged_shadow_positive: true,
              publicly_legible: false,
              inverting_cohort: false,
          }
      }

      #[test]
      fn raw_self_dealing_public_all_unqualified() {
          let unrealized = WalletEvidence {
              realized: false,
              ..full()
          };
          assert_eq!(classify_wallet(&unrealized), SmartMoneyClass::Unqualified);
          let selfdeal = WalletEvidence {
              self_dealing: true,
              ..full()
          };
          assert_eq!(classify_wallet(&selfdeal), SmartMoneyClass::Unqualified);
          let public = WalletEvidence {
              publicly_legible: true,
              ..full()
          };
          assert_eq!(classify_wallet(&public), SmartMoneyClass::Unqualified);
      }
      #[test]
      fn full_gate_qualifies() {
          assert_eq!(classify_wallet(&full()), SmartMoneyClass::Qualified);
      }
      #[test]
      fn missing_a_gate_unqualified() {
          let no_luck = WalletEvidence {
              luck_filtered: false,
              ..full()
          };
          assert_eq!(classify_wallet(&no_luck), SmartMoneyClass::Unqualified);
      }
    max_lines: 40

  - leaf_id: si_signal_scoring_only
    responsibility: "smart-money signals modify scoring/sizing/risk/rotation only, never trigger a direct trade or mirror (criterion 87)"
    signature: >
      pub fn apply_smart_money(base: ScoringInputs, sm: SmartMoneyClass) -> ScoringInputs
    invariants:
      - "the function returns modified ScoringInputs — it CANNOT return or construct an Order"
      - "an inverting/demoted cohort reduces score (fast-kill path), never flips to a buy trigger"
      - "the smart-money contribution enters scoring exactly once"
      - "Qualified raises, Unqualified is neutral, Inverting lowers — none produce a trade directly"
    reference_pattern: "signal adjusts a score field only; the order decision is downstream through the full pipeline"
    property_test: |
      #[test]
      fn inverting_lowers_and_single_application() {
          let base = ScoringInputs {
              base_score: 500,
              smart_money_applied: false,
              smart_money_delta: 0,
          };
          let inv = apply_smart_money(base.clone(), SmartMoneyClass::Inverting);
          assert!(inv.base_score < base.base_score);
          assert!(inv.smart_money_applied);
          // applying again is a no-op (exactly once)
          let inv2 = apply_smart_money(inv.clone(), SmartMoneyClass::Inverting);
          assert_eq!(inv2, inv);
      }
      #[test]
      fn qualified_raises_unqualified_neutral() {
          let base = ScoringInputs {
              base_score: 100,
              smart_money_applied: false,
              smart_money_delta: 0,
          };
          let q = apply_smart_money(base.clone(), SmartMoneyClass::Qualified);
          assert!(q.base_score > base.base_score);
          let base2 = ScoringInputs {
              base_score: 100,
              smart_money_applied: false,
              smart_money_delta: 0,
          };
          let u = apply_smart_money(base2, SmartMoneyClass::Unqualified);
          assert_eq!(u.base_score, 100);
      }
