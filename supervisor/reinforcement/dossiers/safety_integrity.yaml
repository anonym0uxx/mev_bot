  - leaf_id: si_authenticity_once
    responsibility: "flow authenticity confidence enters the sizing chain exactly once — either through the edge estimate OR as an explicit haircut, never both (criterion 101)"
    signature: >
      pub fn apply_authenticity(size_in: SizeInputs, auth: AuthConfidence, mode: AuthMode) -> SizeInputs
    invariants:
      - "AuthMode::ThroughEdge folds authenticity into the edge estimate and leaves the haircut at 1.0"
      - "AuthMode::Haircut applies an explicit size haircut and leaves the edge unmodified"
      - "the two modes are mutually exclusive; applying both is unrepresentable in one call"
      - "a double-application (edge already authenticity-adjusted, then haircut) is detected and rejected"
    reference_pattern: "enum AuthMode { ThroughEdge, Haircut } — the type forbids applying authenticity twice"
    property_test: |
      #[test]
      fn each_mode_touches_only_its_channel() {
          let s = SizeInputs::fresh(200);
          let edge = apply_authenticity(
              s.clone(),
              AuthConfidence { bps: 5000 },
              AuthMode::ThroughEdge,
          );
          assert_eq!(edge.edge_bps, 100); // 200 * 0.5
          assert_eq!(edge.haircut_bps, 10_000); // haircut untouched
          assert!(edge.edge_auth_adjusted && !edge.haircut_applied);

          let hc = apply_authenticity(s.clone(), AuthConfidence { bps: 5000 }, AuthMode::Haircut);
          assert_eq!(hc.edge_bps, 200); // edge untouched
          assert_eq!(hc.haircut_bps, 5000);
          assert!(hc.haircut_applied && !hc.edge_auth_adjusted);
      }
      #[test]
      fn double_application_rejected() {
          let s = SizeInputs::fresh(200);
          let once = apply_authenticity(s, AuthConfidence { bps: 5000 }, AuthMode::ThroughEdge);
          // now try to also apply a haircut -> must be rejected (unchanged)
          let twice = apply_authenticity(
              once.clone(),
              AuthConfidence { bps: 5000 },
              AuthMode::Haircut,
          );
          assert_eq!(twice, once);
      }
    max_lines: 30

  - leaf_id: si_lpi_screen
    responsibility: "LPI (depth/phase-normalized appreciation-per-net-inflow anomaly) as a named fabrication signature; detected wash/LPI persists as a decaying extraction-risk covariate (criterion 105)"
    signature: >
      pub fn lpi_score(flow: &FlowWindow, depth: u64, phase: MarketPhase) -> LpiVerdict
    invariants:
      - "appreciation far exceeding what net inflow at the observed depth supports yields LpiVerdict::Fabricated"
      - "the score is depth- and phase-normalized (same raw move at different depths scores differently)"
      - "a detected fabrication contributes a decaying covariate (half-life defined, not permanent, not zero)"
      - "over-rejection is measurable (the verdict exposes its threshold margin)"
    reference_pattern: "normalize move by (net_inflow, depth, phase); threshold -> Fabricated; emit decaying covariate"
    property_test: |
      #[test]
      fn impossible_move_is_fabricated() {
          // tiny inflow, deep market, huge appreciation -> unsupportable
          let flow = FlowWindow {
              net_inflow: 1,
              appreciation_bps: 50_000,
              age_secs: 0,
          };
          match lpi_score(&flow, 1_000_000, MarketPhase::Late) {
              LpiVerdict::Fabricated {
                  covariate_bps,
                  threshold_margin,
              } => {
                  assert!(covariate_bps > 0); // non-zero at detection
                  assert!(threshold_margin > 0); // beyond support
              }
              v => panic!("expected Fabricated, got {:?}", v),
          }
      }
      #[test]
      fn depth_normalization_changes_verdict() {
          let flow = FlowWindow {
              net_inflow: 100,
              appreciation_bps: 5_000,
              age_secs: 0,
          };
          let shallow = lpi_score(&flow, 1, MarketPhase::Mid); // lots of support
          let deep = lpi_score(&flow, 10_000_000, MarketPhase::Mid); // little support
          assert!(matches!(shallow, LpiVerdict::Clean { .. }));
          assert!(matches!(deep, LpiVerdict::Fabricated { .. }));
      }
      #[test]
      fn covariate_decays_with_age() {
          let young = FlowWindow {
              net_inflow: 1,
              appreciation_bps: 50_000,
              age_secs: 0,
          };
          let old = FlowWindow {
              net_inflow: 1,
              appreciation_bps: 50_000,
              age_secs: LPI_COVARIATE_HALF_LIFE_SECS,
          };
          let cy = match lpi_score(&young, 1_000_000, MarketPhase::Late) {
              LpiVerdict::Fabricated { covariate_bps, .. } => covariate_bps,
              _ => panic!(),
          };
          let co = match lpi_score(&old, 1_000_000, MarketPhase::Late) {
              LpiVerdict::Fabricated { covariate_bps, .. } => covariate_bps,
              _ => panic!(),
          };
          assert_eq!(co, cy / 2); // one half-life
          assert!(co < cy);
      }
    max_lines: 40

  - leaf_id: si_bounded_evict
    responsibility: "capacity-bounded structure with a defined eviction policy: a long-lived buffer never grows without bound; eviction is deterministic (criterion 99, laptop-testable part)"
    signature: >
      pub fn admit_with_eviction<T>(buf: &mut BoundedRing<T>, item: T) -> Option<T>
    invariants:
      - "the buffer never exceeds its capacity N (push at capacity evicts the oldest, returned as Some)"
      - "below capacity, push returns None and grows by one"
      - "eviction order is deterministic (FIFO/defined), never arbitrary"
      - "the structure exposes its current length and capacity for the soak monitor"
    reference_pattern: "ring buffer with fixed N; at capacity, evict-oldest-then-insert; return the evicted item"
    property_test: |
      #[test]
      fn never_exceeds_capacity_and_evicts_oldest() {
          let mut ring: BoundedRing<u32> = BoundedRing::new(3);
          assert_eq!(ring.capacity(), 3);
          assert_eq!(admit_with_eviction(&mut ring, 1), None);
          assert_eq!(admit_with_eviction(&mut ring, 2), None);
          assert_eq!(admit_with_eviction(&mut ring, 3), None);
          assert_eq!(ring.len(), 3);
          // at capacity: evict oldest (1) deterministically
          assert_eq!(admit_with_eviction(&mut ring, 4), Some(1));
          assert_eq!(ring.len(), 3);
          assert!(ring.len() <= ring.capacity());
          assert_eq!(admit_with_eviction(&mut ring, 5), Some(2));
          assert_eq!(ring.front(), Some(&3));
          assert_eq!(ring.back(), Some(&5));
      }
    max_lines: 30

  - leaf_id: si_backpressure_stale
    responsibility: "under overload, produce explicit stale-rejection rather than processing outdated observations or blocking (criterion 23)"
    signature: >
      pub fn admit_or_stale(obs_ts_ns: u64, now_ns: u64, max_age_ns: u64) -> Admission
    invariants:
      - "an observation older than max_age_ns yields Admission::RejectStale"
      - "a fresh observation yields Admission::Accept"
      - "the decision is a pure comparison; no blocking, no unbounded queue"
      - "boundary (age exactly max_age_ns) is defined and consistent"
    reference_pattern: "if now - ts > max_age => RejectStale; the hot path sheds load rather than falling behind"
    property_test: |
      #[test]
      fn stale_rejected_fresh_accepted_boundary_defined() {
          // fresh
          assert_eq!(admit_or_stale(1000, 1500, 1000), Admission::Accept);
          // stale (age 2000 > 1000)
          assert_eq!(admit_or_stale(1000, 3000, 1000), Admission::RejectStale);
          // boundary: age exactly max_age -> Accept
          assert_eq!(admit_or_stale(1000, 2000, 1000), Admission::Accept);
          // just over boundary -> RejectStale
          assert_eq!(admit_or_stale(1000, 2001, 1000), Admission::RejectStale);
          // future timestamp saturates to age 0 -> Accept
          assert_eq!(admit_or_stale(5000, 1000, 1000), Admission::Accept);
      }
    max_lines: 25
