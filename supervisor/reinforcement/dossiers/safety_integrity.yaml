  - leaf_id: si_quote_mint_param
    responsibility: "all curve/cost/sizing/slippage math is quote-mint parametric (SOL vs USDC decoded per market); no SOL-quote assumption is hardcoded (criterion 94)"
    signature: >
      pub fn round_trip_cost_quote(size: u64, mkt: &Market, quote: QuoteMint) -> Option<u64>
    invariants:
      - "the same nominal size in a USDC-quote market and a SOL-quote market uses each market's decoded quote decimals"
      - "no constant assumes 9 decimals / SOL; quote decimals come from QuoteMint"
      - "a market whose quote mint is undecoded yields None (refuse, not assume SOL)"
      - "cost is expressed in the market's quote units consistently"
    reference_pattern: "QuoteMint carries decimals + mint; every lamport<->quote conversion goes through it; no hardcoded 1e9"
    property_test: |
      #[test]
      fn usdc_and_sol_decimals_differ() {
          let mkt = Market {
              fee_bps: 100,
              fixed_cost_whole: 1,
          };
          let usdc = round_trip_cost_quote(1_000_000, &mkt, QuoteMint::Usdc { decimals: 6 }).unwrap();
          let sol = round_trip_cost_quote(1_000_000, &mkt, QuoteMint::Sol { decimals: 9 }).unwrap();
          // fee round trip = 1_000_000 * 100/10000 * 2 = 20_000 for both;
          // fixed: usdc = 1 * 1e6, sol = 1 * 1e9 -> different totals.
          assert_eq!(usdc, 20_000 + 1_000_000);
          assert_eq!(sol, 20_000 + 1_000_000_000);
          assert_ne!(usdc, sol);
      }
      #[test]
      fn undecoded_quote_refuses() {
          let mkt = Market {
              fee_bps: 100,
              fixed_cost_whole: 1,
          };
          assert_eq!(
              round_trip_cost_quote(1_000_000, &mkt, QuoteMint::Undecoded),
              None
          );
      }
