# Hot-path constitution lint scope + extra rules (criterion 109 / §24).
#
# This file is the AUTHORITATIVE, committed source of the hot/money lint scope,
# so the enforcement is an explicit data decision — not a silent code default
# that can (and did) point at crates which do not exist, matching zero files and
# making the whole lint a no-op. `supervisor/gates/hotpath_lint.py` reads
# `hot_globs` / `money_globs` from here; `scripts/ci_gate.py` passes them
# explicitly. Globs are repo-relative and `**`-recursive.
#
# The bans themselves (async/tokio/serde_json/float/syscall-clock/sleep/
# alloc-macros/panic on the hot path; float casts in money crates; Linux-isms +
# /tmp everywhere) are defined in code. A banned token inside a `//`/`/* */`
# comment or a `#[cfg(test)]` module is NOT a violation (matcher tightening, not
# a ban relaxation). A provably-safe hit carries an inline
# `LINT-ALLOW(rule_id): reason` — counted and reported, never silent.

# HOT — the latency-critical decision path. The pure integer crates the hot loop
# calls into. No async/await, no floats (quantize only at boundary adapters), no
# panics-by-construction here.
hot_globs:
  - "rust/crates/pump-quant-core/src/**/*.rs"
  - "rust/crates/pump-quant-signals/src/**/*.rs"
  - "rust/crates/pump-quant-features/src/**/*.rs"
  - "rust/crates/pump-quant-protocol/src/**/*.rs"
  # --- app hot modules (hand-off COMPLETE) ---
  # The app owner annotated the three legitimate, provably-safe hits with an inline
  # LINT-ALLOW (cold-init / guarded, not real hot-loop defects), so the app's hot
  # modules are now IN the enforced HOT set:
  #   - engine.rs   format!("{cfg:?}") cold one-shot config-identity seed
  #                                                 -> LINT-ALLOW(hot_alloc_fmt)
  #   - position.rs .expect() after a checked `open.remove` on a known-open position
  #                                                 -> LINT-ALLOW(hot_panic)
  #   - structure.rs .expect("interval clamped >= 1") documented-infallible bar spec
  #                                                 -> LINT-ALLOW(hot_panic)
  - "rust/crates/pump-quant-app/src/engine.rs"
  - "rust/crates/pump-quant-app/src/lane.rs"
  - "rust/crates/pump-quant-app/src/attention.rs"
  - "rust/crates/pump-quant-app/src/position.rs"
  - "rust/crates/pump-quant-app/src/structure.rs"
  # --- Phase-B crates (added 2026-07-29, before the Phase-B build starts) ---
  # These three were in NEITHER scope. Each crate root ASSERTS §22 in prose —
  # execution: "every value that affects an on-chain decision is integer /
  # fixed-point"; ingest: "no floating point in any outcome-controlling path";
  # journal: "there is no f32/f64 anywhere in this crate" — and all three claims
  # were true only because nobody had broken them yet. The code that computes what
  # to send to chain was outside the float ban, outside the panic ban, and outside
  # the syscall-clock ban, which is the wrong place to leave unenforced when the
  # next hands on it may be a weaker model's.
  #
  # Bringing them in cost exactly one production fix: helius_parse.rs built its
  # pump.fun invoke prefix with `format!` once per parsed transaction; it is now a
  # `const` (a real allocation removed from the per-transaction decode path), with
  # `prefix_matches_program_id` proving the literal cannot drift from the const id.
  #
  # NOTE for a Phase-B builder: `pump-quant-ingest` is a boundary/parsing crate and
  # `hot_float` bans the f32/f64 TOKEN outright. If a sanctioned boundary
  # quantization is ever genuinely needed there, the answer is an inline
  # `LINT-ALLOW(hot_float): reason` (the convention `pump-quant-core/src/reducer.rs`
  # already establishes) — counted and reported, never silent. It is NOT to widen
  # this file.
  - "rust/crates/pump-quant-execution/src/**/*.rs"
  - "rust/crates/pump-quant-ingest/src/**/*.rs"
  - "rust/crates/pump-quant-journal/src/**/*.rs"
  # --- Junction crate (added 2026-07-31, Phase B Task B) ---
  # The junction translates live ingest feeds into AppEvent streams on the
  # decode path. No async, no floats, no panics, no per-event allocation
  # (§24/criterion 109). hotpath_lint must cover it before code is written.
  - "rust/crates/pump-quant-junction/src/**/*.rs"

# MONEY — every crate that computes or carries money / outcome quantities, where
# an `as f32`/`as f64` cast is a §22 integrity violation.
money_globs:
  - "rust/crates/pump-quant-core/src/**/*.rs"
  - "rust/crates/pump-quant-strategy/src/**/*.rs"
  - "rust/crates/pump-quant-evaluator/src/**/*.rs"
  - "rust/crates/pump-quant-domain/src/**/*.rs"
  - "rust/crates/pump-quant-market-state/src/**/*.rs"
  - "rust/crates/pump-quant-features/src/**/*.rs"
  - "rust/crates/pump-quant-simulator/src/**/*.rs"
  - "rust/crates/pump-quant-narrative/src/**/*.rs"
  - "rust/crates/pump-quant-wallet-graph/src/**/*.rs"
  - "rust/crates/pump-quant-watchlist/src/**/*.rs"
  - "rust/crates/pump-quant-memory/src/**/*.rs"
  # --- Phase-B crates (added 2026-07-29) — see the note in `hot_globs`. ---
  # `pump-quant-execution` in particular sizes and prices what is submitted to
  # chain; an `as f64` there is a §22 integrity violation of the most direct kind.
  - "rust/crates/pump-quant-execution/src/**/*.rs"
  - "rust/crates/pump-quant-ingest/src/**/*.rs"
  - "rust/crates/pump-quant-journal/src/**/*.rs"

# Optional additional data-defined rules (same schema as the built-ins). None yet.
rules: []
