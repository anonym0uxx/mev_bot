# Hermes bot workspace. The §24 performance-engineering law (criterion 109) is encoded as
# build configuration so it is compiled in rather than remembered. Phase-A (laptop) builds use
# the dev/portable profile; the release profile's deploy-CPU pinning and PGO are the server's job.
[workspace]
resolver = "2"
members = [
    "crates/pump-quant-signals",
    "crates/pump-quant-protocol",
    "crates/pump-quant-execution",
    "crates/pump-quant-ingest",
    "crates/pump-quant-core",
    "crates/pump-quant-strategy",
    "crates/pump-quant-evaluator",
    "crates/pump-quant-canonical",
    "crates/pump-quant-clock",
    "crates/pump-quant-domain",
    "crates/pump-quant-features",
    "crates/pump-quant-governance",
    "crates/pump-quant-journal",
    "crates/pump-quant-market-state",
    "crates/pump-quant-memory",
    "crates/pump-quant-narrative",
    "crates/pump-quant-simulator",
    "crates/pump-quant-social",
    "crates/pump-quant-wallet-graph",
    "crates/pump-quant-watchlist",
    "crates/pump-quant-replay",
    "crates/pump-quant-app",
    "crates/pump-quant-junction",
    "crates/pump-quant-brain",
    "crates/pq-evaluator",
    "crates/pq-research-runner",
    "crates/pq-regression",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
overflow-checks = false

# money/fixed-point & outcome-controlling crates keep overflow checks in release —
# silent money wrap is prohibited (§22). Plumbing crates (clock, journal, canonical,
# governance, social) inherit the workspace default.
[profile.release.package.pump-quant-app]
# The composition root owns `bankroll_realized`, `bankroll_committed`, `book_exit`,
# and all of `position.rs::realize` — i.e. every lamport the bot actually books. It
# was missing from this list, which meant the ONE crate §22's "silent money wrap is
# prohibited" rule most obviously targets was compiling with overflow-checks OFF in
# release. (Audit 2026-07-25.)
overflow-checks = true
[profile.release.package.pump-quant-brain]
overflow-checks = true
[profile.release.package.pump-quant-core]
overflow-checks = true
[profile.release.package.pump-quant-strategy]
overflow-checks = true
[profile.release.package.pump-quant-evaluator]
overflow-checks = true
[profile.release.package.pump-quant-domain]
overflow-checks = true
[profile.release.package.pump-quant-market-state]
overflow-checks = true
[profile.release.package.pump-quant-features]
overflow-checks = true
[profile.release.package.pump-quant-simulator]
overflow-checks = true
[profile.release.package.pump-quant-narrative]
overflow-checks = true
[profile.release.package.pump-quant-wallet-graph]
overflow-checks = true
[profile.release.package.pump-quant-watchlist]
overflow-checks = true
[profile.release.package.pump-quant-memory]
overflow-checks = true

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.bench]
inherits = "release"
debug = 1

# NOTE (§24(a)): -C target-cpu is NOT set here — it is injected via RUSTFLAGS from the
# infrastructure manifest's deploy-CPU entry on the server. Never `native` on the build box.
