[package]
name = "pump-quant-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pump-quant"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hashbrown = "0.15"
arrayvec = "0.7"
bs58 = "0.5"
quanta = "0.12"
crossbeam-channel = "0.5"
futures-util = "0.3"
thiserror = "2.0"
anyhow = "1.0"

# Transaction building & Solana SDK
# NOTE: spl-associated-token-account and spl-token omitted due to
# zeroize version conflict (curve25519-dalek v3 <1.4 vs rustls >=1.7).
# ATA derivation is done manually via Pubkey::find_program_address.
solana-sdk = "=2.1.16"

# Jito bundle submission (REST)
reqwest = { version = "0.12", features = ["json"] }

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
base64 = "0.22"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
