[package]
name = "pump-quant-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pump-quant"
path = "src/main.rs"



[[bin]]
name = "manual-sell"
path = "src/bin/manual_sell.rs"

[dependencies]
tokio = { version = "1.44", features = ["full", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
simd-json = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hashbrown = "0.15"
arrayvec = "0.7"
bs58 = "0.5"
quanta = "0.12"
crossbeam-channel = "0.5"
memchr = "2.8"
dashmap = "6.1"
futures-util = "0.3"
thiserror = "2.0"
anyhow = "1.0"

# Transaction building & Solana SDK
# NOTE: spl-associated-token-account and spl-token omitted due to
# zeroize version conflict (curve25519-dalek v3 <1.4 vs rustls >=1.7).
# ATA derivation is done manually via Pubkey::find_program_address.
solana-sdk = "=2.1.16"

# Jito bundle submission (REST)
reqwest = { version = "0.12", features = ["json", "http2"] }

# Persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP API
axum = "0.7"

# .env file loading
dotenvy = "0.15"

# Async trait object safety
async-trait = "0.1"

# System tuning (CPU pinning, mlockall, setsockopt)
libc = "0.2"

# Sync RwLock / Mutex (no-poison, faster than std)
parking_lot = "0.12"

# Lazy statics
once_cell = "1.19"

# Serialization
base64 = "0.22"
bincode = "1.3"

# gRPC (ShredStream proxy client)
tonic = "0.12"
prost = "0.13"
http = "1.0"

# Solana Entry deserialization (ShredStream gRPC entries)
solana-entry = "=2.1.16"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hot_path"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[[bin]]
name = "manual-sell-DtSQeRmkG9"
path = "src/bin/manual_sell_DtSQeRmkG9.rs"

[[bin]]
name = "ata-check"
path = "/tmp/ata_check.rs"

[[bin]]
name = "fee-check"
path = "/tmp/fee_check.rs"

[[bin]]
name = "fee-check2"
path = "/tmp/fee_check2.rs"

[[bin]]
name = "fee-verify"
path = "/tmp/fee_verify.rs"

[[bin]]
name = "parse-config"
path = "/tmp/parse_config.rs"

[[bin]]
name = "find-2fn8"
path = "/tmp/find_2fn8.rs"

[[bin]]
name = "parse-gc"
path = "/tmp/parse_gc.rs"

[[bin]]
name = "find-reserved"
path = "/tmp/find_reserved.rs"

[[bin]]
name = "gc-full"
path = "/tmp/gc_full.rs"
