[package]
name = "pump-quant-inference"
version = "0.1.0"
edition = "2021"
description = "Qwen decision client: llama-server (GGUF) inference over the byte-parity proposal bundle, with fail-closed timeout semantics and bounded ordinal output."

[lib]
name = "pump_quant_inference"
path = "src/lib.rs"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
