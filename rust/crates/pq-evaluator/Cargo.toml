[package]
name = "pq-evaluator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# §44/§62 canonical artifact: the supervisor auto-discovers this binary at
# target/release/pq-evaluator and TOFU-pins its hash. Thin CLI over the frozen
# evaluator leaves in pump-quant-evaluator — all logic lives in the library.
[[bin]]
name = "pq-evaluator"
path = "src/main.rs"

[dependencies]
pump-quant-evaluator = { path = "../pump-quant-evaluator" }
